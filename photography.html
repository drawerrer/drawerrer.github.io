<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Photography Drawer | Collective Archive</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;family=Mrs+Saint+Delafield&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#8B735B",
                        "wood-light": "#E5D3B3",
                        "wood-dark": "#7C6246",
                        "paper-aged": "#F4F1EA",
                    },
                    fontFamily: {
                        display: ["Pretendard Variable", "Pretendard", "sans-serif"],
                        serif: ["Pretendard Variable", "Pretendard", "serif"],
                        sans: ["Pretendard Variable", "Pretendard", "sans-serif"],
                        script: ["Caveat", "cursive"],
                        elegant: ["Mrs Saint Delafield", "cursive"],
                    }
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
        }
        .perspective-2000 {
            perspective: 2000px
        }
        .drawer-tilt {
            transform: rotatex(25deg);
            transform-style: preserve-3d
        }
        .compartment {
            box-shadow: inset 2px 2px 10px rgba(0, 0, 0, 0.25), inset -1px -1px 2px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            aspect-ratio: 3/4;
        }
        .compartment:hover {
            box-shadow: inset 4px 4px 15px rgba(0, 0, 0, 0.35)
        }
        .compartment:hover .post-title {
            opacity: 1;
            transform: translate(-50%, -120%)
        }
        .wood-texture {
            background-color: #e5d3b3;
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAb_Qd6Xc2iIrfeMmHCSkJ4BcCemUIkWBBP05BoJhL8d0I98O_g5xPlrjSkZ5UcvUtXN_yx1LWtEGj5jvyZn1agNnavqWBIExrRYroBuQAZMJ08bZ25iRABJHupxUnGIfMOFCM_BuM-ypROkW_jHSa1RIZ35fMJZEvQY7ffOxBVnRbCL73zYW2xqBPFPLljdQ4uf5Y9TPT9cz585lhkK9CguKRrXhYUCsnAeCKx98chN9jTr-29WtDMpI7LgDm7ny6HrFfmAOW8mXJI);
            background-size: cover;
        }
        .drawer-shadow {
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.4), 0 30px 60px -30px rgba(0, 0, 0, 0.5)
        }
        .scrim-gradient {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%)
        }
        .polaroid-frame {
            box-shadow: 2px 4px 12px rgba(0,0,0,0.35);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Motion & Effects Classes */
        .motion-blur-sm {
            filter: blur(1.5px);
        }
        .ghosting-effect {
            position: relative;
        }
        .ghosting-effect::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            opacity: 0.3;
            transform: translate(4px, -4px);
            pointer-events: none;
            filter: blur(2px);
            z-index: -1;
        }
        
        /* Animation Keyframes */
        @keyframes shuffleShake {
            0% { transform: translate(0, 0) rotate(var(--rot)); }
            25% { transform: translate(2px, 2px) rotate(var(--rot)); }
            50% { transform: translate(-2px, -2px) rotate(var(--rot)); }
            75% { transform: translate(2px, -2px) rotate(var(--rot)); }
            100% { transform: translate(0, 0) rotate(var(--rot)); }
        }
        
        .shaking .polaroid-frame {
            animation: shuffleShake 0.3s ease-in-out infinite;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.2) contrast(1.1); /* Subtle vintage feel */
        }
    </style>
</head>

<body class="bg-gray-200 dark:bg-zinc-950 font-sans h-screen overflow-hidden transition-colors duration-700">
    <div class="fixed inset-0 z-0 bg-white/40 dark:bg-black/60 backdrop-blur-md"></div>
    <main class="relative z-10 h-full w-full flex flex-col items-center justify-center p-0 md:p-12 perspective-2000">

        <!-- Back Navigation -->
        <a class="fixed top-8 left-8 z-[250] flex items-center justify-center text-stone-700 hover:text-stone-900 dark:text-stone-300 dark:hover:text-white transition-colors group bg-white/40 dark:bg-black/30 backdrop-blur-md p-3 rounded-full border border-white/40 dark:border-white/10 shadow-sm"
            href="blog.html">
            <span class="material-symbols-outlined text-lg">arrow_back</span>
        </a>

        <!-- Drawer Frame (Wood) -->
        <div
            class="drawer-tilt relative w-full h-full md:h-auto md:max-w-5xl bg-[#DCC6A1] p-0 md:p-5 rounded-none md:rounded-sm drawer-shadow border-t-0 md:border-t-4 border-l-0 md:border-l-2 border-white/40 md:border-white/20 flex flex-col">
            <div class="absolute -top-4 left-0 w-full h-4 bg-[#C8B28E] rounded-t-sm hidden md:block"></div>
            <div
                class="wood-texture p-0 md:p-4 border-none md:border-2 border-black/20 shadow-none md:shadow-inner relative flex-1 min-h-0 md:min-h-[600px] overflow-hidden">
                <div class="absolute inset-0 pointer-events-none scrim-gradient opacity-50 z-50"></div>

                <!-- COMPARTMENTS GRID / FEED -->
                <div class="grid grid-cols-1 md:grid-cols-5 gap-0 md:gap-4 overflow-y-auto h-full scrollbar-hide py-12 px-4 md:p-0"
                    id="photoGrid">
                    <!-- Javascript will populate this -->
                </div>
            </div>

            <!-- Label -->
            <div
                class="h-16 bg-[#DCC6A1] border-t-2 border-black/15 flex flex-col items-center justify-center relative shrink-0 z-[60]">
                <div class="flex items-center gap-4 bg-white/90 px-4 py-1.5 border border-black/20 shadow-sm mb-1">
                    <span class="text-[10px] font-bold text-gray-400">02</span>
                    <span class="font-display text-sm tracking-[0.3em] font-medium text-gray-800">PHOTOGRAPHY</span>
                </div>
                <div class="w-24 h-2 border-x-2 border-b-2 border-black/20 rounded-b-xl mt-1"></div>
            </div>
        </div>

        <!-- Metadata Footer -->


        <!-- Action Area -->


        </div>
    </main>

    <nav class="fixed top-8 right-8 z-50 flex flex-col items-end gap-3">
        <button
            class="p-3 rounded-full bg-white/40 backdrop-blur-md border border-white/40 text-stone-800 hover:scale-110 transition-all shadow-lg"
            onclick="toggleTheme()">
            <span class="material-symbols-outlined block dark:hidden">dark_mode</span>
            <span class="material-symbols-outlined hidden dark:block">light_mode</span>
        </button>

        <button id="refreshBtn"
            class="group flex items-center gap-3 bg-white/40 dark:bg-black/30 backdrop-blur-md border border-white/40 dark:border-white/10 px-4 py-2 rounded-full hover:bg-white/60 dark:hover:bg-black/50 transition-all shadow-sm active:scale-95">
            <span
                class="text-[10px] font-display font-semibold tracking-[0.2em] text-stone-700 dark:text-stone-300 group-hover:text-stone-900 dark:group-hover:text-white">REFRESH</span>
            <div
                class="w-8 h-8 rounded-full bg-stone-800 dark:bg-stone-200 flex items-center justify-center transition-transform duration-500 group-hover:rotate-180">
                <span class="material-symbols-outlined text-white dark:text-stone-900 text-sm">refresh</span>
            </div>
        </button>
    </nav>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const grid = document.getElementById('photoGrid');
        const refreshBtn = document.getElementById('refreshBtn');

        let allPhotos = [];

        async function loadPhotos() {
            try {
                const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                allPhotos = [];
                querySnapshot.forEach((doc) => {
                    allPhotos.push(doc.data());
                });

                // If empty, maybe show placeholder or nothing
                renderGrid(true); // Initial render with animation
            } catch (error) {
                console.error("Error loading specific photos:", error);
                // Fallback or empty state
                grid.innerHTML = '<div class="col-span-full text-center text-stone-500 italic pt-20">Loading memories failed.</div>';
            }
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderGrid(animate = false) {
            grid.innerHTML = '';

            if (allPhotos.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-stone-500 italic pt-20">No photos uploaded yet.</div>';
                return;
            }

            // Shuffle and pick 15
            const shuffled = shuffleArray(allPhotos);
            const selectedImages = shuffled.slice(0, 15);

            selectedImages.forEach((photo, index) => {
                // Polaroid Container
                const container = document.createElement('div');
                // Random rotation
                const polaroidRotation = Math.random() * 6 - 3;

                container.className = "polaroid-frame group relative aspect-[4/5] bg-white p-3 md:p-2 shadow-lg hover:shadow-2xl hover:scale-[1.02] hover:z-10 transition-all duration-300 cursor-pointer overflow-hidden transform-gpu";
                container.style.transform = `rotate(${polaroidRotation}deg)`;

                // Image
                const img = document.createElement('img');
                img.src = photo.url;
                img.className = "w-full h-[85%] object-cover block bg-gray-100";
                img.loading = "lazy";
                img.alt = photo.caption || "Memory";

                // Caption Area
                const caption = document.createElement('div');
                caption.className = "h-[15%] flex items-center justify-center";
                // Show caption if exists, else number
                const captionText = photo.caption ? photo.caption : `#${index + 1}`;
                caption.innerHTML = `<span class="font-elegant text-stone-400 text-lg md:text-sm truncate px-2">${captionText}</span>`;

                container.appendChild(img);
                container.appendChild(caption);

                // Append
                grid.appendChild(container);

                // Entrance Animation
                if (animate) {
                    container.style.opacity = '0';
                    container.style.transform += ' translateY(20px)';
                    setTimeout(() => {
                        container.style.transition = 'all 0.6s ease';
                        container.style.opacity = '1';
                        container.style.transform = `rotate(${polaroidRotation}deg)`;
                    }, index * 50);
                }
            });
        }

        function triggerShuffle() {
            const frames = document.querySelectorAll('.polaroid-frame');

            // 1. Add Motion Effects
            frames.forEach(frame => {
                const isGhost = Math.random() > 0.5;
                const isBur = Math.random() > 0.3;

                if (isGhost) frame.classList.add('ghosting-effect');
                if (isBur) frame.classList.add('motion-blur-sm');
            });

            grid.classList.add('shaking');

            // 2. Wait, then shuffle content
            setTimeout(() => {
                renderGrid(true);

                const newFrames = document.querySelectorAll('.polaroid-frame');
                newFrames.forEach(frame => {
                    frame.classList.add('motion-blur-sm');
                });

                // 3. Cleanup
                setTimeout(() => {
                    grid.classList.remove('shaking');
                    newFrames.forEach(frame => {
                        frame.classList.remove('motion-blur-sm');
                        frame.classList.remove('ghosting-effect');
                    });
                }, 300);

            }, 250);
        }

        refreshBtn.addEventListener('click', triggerShuffle);

        // Initial Load
        loadPhotos();
    </script>
</body>

</html>
