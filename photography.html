    <script>
        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>

    <style type="text/tailwindcss">
        .material-symbols-outlined {

        }
        .scrim-gradient {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%)
        }
        .polaroid-frame {
            box-shadow: 2px 4px 12px rgba(0,0,0,0.35);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Motion & Effects Classes */
        .motion-blur-sm {
            filter: blur(1.5px);
        }
        .ghosting-effect {
            position: relative;
        }
        .ghosting-effect::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            opacity: 0.3;
            transform: translate(4px, -4px);
            pointer-events: none;
            filter: blur(2px);
            z-index: -1;
        }
        
        /* Animation Keyframes */
        @keyframes shuffleShake {
            0% { transform: translate(0, 0) rotate(var(--rot)); }
            25% { transform: translate(2px, 2px) rotate(var(--rot)); }
            50% { transform: translate(-2px, -2px) rotate(var(--rot)); }
            75% { transform: translate(2px, -2px) rotate(var(--rot)); }
            100% { transform: translate(0, 0) rotate(var(--rot)); }
        }
        
        .shaking .polaroid-frame {
            animation: shuffleShake 0.3s ease-in-out infinite;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.2) contrast(1.1); /* Subtle vintage feel */
        }

        /* Postcard Modal Styles */

            background-color: rgba(0,0,0,0.6);

        }
        .postcard-container {

        /* Stamp style for close button */

            background-position: 0 0, 3px 3px;
            background-size: 6px 6px;
