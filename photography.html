    <script>
        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>

        /* Motion & Effects Classes */
        .motion-blur-sm {
            filter: blur(1.5px);
        }
        .ghosting-effect {
            position: relative;
        }
        .ghosting-effect::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            opacity: 0.3;
            transform: translate(4px, -4px);
            pointer-events: none;
            filter: blur(2px);
            z-index: -1;
        }
        
        /* Animation Keyframes */
        @keyframes shuffleShake {
            0% { transform: translate(0, 0) rotate(var(--rot)); }
            25% { transform: translate(2px, 2px) rotate(var(--rot)); }
            50% { transform: translate(-2px, -2px) rotate(var(--rot)); }
            75% { transform: translate(2px, -2px) rotate(var(--rot)); }
            100% { transform: translate(0, 0) rotate(var(--rot)); }
        }
        
        .shaking .polaroid-frame {
            animation: shuffleShake 0.3s ease-in-out infinite;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;

        const grid = document.getElementById('photoGrid');
        const refreshBtn = document.getElementById('refreshBtn');

        function getRandomRotate() {
            return Math.floor(Math.random() * 8) - 4; // -4 to 4 degrees
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderGrid(animate = false) {
            grid.innerHTML = '';

            // Shuffle full list and pick 15
            const shuffled = shuffleArray([...allImages]);
            const selectedImages = shuffled.slice(0, 15);

            selectedImages.forEach((imgFn, index) => {
                // Polaroid Container
                const container = document.createElement('div');
                // Random rotation for natural look
                const polaroidRotation = Math.random() * 6 - 3; // -3deg to +3deg

                container.className = "group relative aspect-[4/5] bg-white p-3 md:p-2 shadow-lg hover:shadow-2xl hover:scale-[1.02] hover:z-10 transition-all duration-300 cursor-pointer overflow-hidden transform-gpu";
                container.style.transform = `rotate(${polaroidRotation}deg)`;

                // Image
                const img = document.createElement('img');
                img.src = `instagram_stories/${imgFn}`;
                img.className = "w-full h-[85%] object-cover block bg-gray-100";
                img.loading = "lazy";
                img.alt = "Memory";

                // Caption Area
                const caption = document.createElement('div');
                caption.className = "h-[15%] flex items-center justify-center";
                caption.innerHTML = `<span class="font-elegant text-stone-400 text-lg md:text-sm">#${index + 1}</span>`;

                container.appendChild(img);
                container.appendChild(caption);

                // Append directly to grid
                grid.appendChild(container);

                // Entrance Animation
                if (animate) {
                    container.style.opacity = '0';
                    container.style.transform += ' translateY(20px)';
                    setTimeout(() => {
                        container.style.transition = 'all 0.6s ease';
                        container.style.opacity = '1';
                        container.style.transform = `rotate(${polaroidRotation}deg)`;
                    }, index * 50);
                }
            });
        }

        function triggerShuffle() {
            const frames = document.querySelectorAll('.polaroid-frame');

            // 1. Add Motion Effects
            frames.forEach(frame => {
                const isGhost = Math.random() > 0.5;
                const isBur = Math.random() > 0.3;

                if (isGhost) frame.classList.add('ghosting-effect');
                if (isBur) frame.classList.add('motion-blur-sm');
            });

            grid.classList.add('shaking');

            // 2. Wait, then shuffle content
            setTimeout(() => {
                renderGrid(true); // Re-render with new set of images

                const newFrames = document.querySelectorAll('.polaroid-frame');
                newFrames.forEach(frame => {
                    frame.classList.add('motion-blur-sm');
                });

                // 3. Cleanup
                setTimeout(() => {
                    grid.classList.remove('shaking');
                    newFrames.forEach(frame => {
                        frame.classList.remove('motion-blur-sm');
                        frame.classList.remove('ghosting-effect');
                    });
                }, 300);

            }, 250);
        }

        refreshBtn.addEventListener('click', triggerShuffle);

        // Initial Render
        renderGrid();
    </script>
