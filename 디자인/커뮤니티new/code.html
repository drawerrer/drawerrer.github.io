<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Community Drawer | Collective Archive</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Space+Grotesk:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#8B735B",
                        "wood-light": "#E5D3B3",
                        "wood-dark": "#7C6246",
                        "paper-aged": "#F4F1EA",
                    },
                    fontFamily: {
                        display: ["Space Grotesk", "sans-serif"],
                        serif: ["Playfair Display", "serif"],
                        sans: ["Inter", "sans-serif"],
                    }
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
        }
        .perspective-2000 {
            perspective: 2000px
        }
        .drawer-tilt {
            transform: rotateX(20deg);
            transform-style: preserve-3d
        }
        .compartment {
            box-shadow: inset 2px 2px 10px rgba(0, 0, 0, 0.3), inset -1px -1px 2px rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.15)
        }
        .wood-texture {
            background-color: #dcc6a1;
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuC_MrSaZotVYPBLV-UiMfa5DVVMHBI8t0h7Co6_yTAg9GPGuKcl8rkcVsId4URWgRiKpYdpjMtZR5AT-SiHyBNBNfO8IW-2qkFH-YRoe-nwIRQNxc55YTWuZV0jEVsgVG9gXpE8MWegYbtUw2HkQFPjqQiMpD_qRzrUCra30QijZZUKpDZyoB0UGy-o4OWsKRrPUbGRcn9K58MDo_Vmz9GI_9ItoS2CVve_Ch3a-HIYX4Q1wWQnspkabGRbXtidingScd71cEE8KwNM);
            background-blend-mode: multiply
        }
        .drawer-shadow {
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5), 0 30px 60px -30px rgba(0, 0, 0, 0.6)
        }
        .paper-stack {
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1), 0 2px 0 #fff, 0 3px 0 rgba(0, 0, 0, 0.1), 0 4px 0 #fff, 0 5px 0 rgba(0, 0, 0, 0.1), 0 10px 20px rgba(0, 0, 0, 0.15)
        }
        .paperclip {
            border: 1.5px solid #a1a1aa;
            border-radius: 10px;
            width: 8px;
            height: 20px;
            position: relative
        }
        .paperclip::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 6px;
            border: 1px solid #a1a1aa;
            border-radius: 6px;
            border-top: none
        }
        .glass-paperweight {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(0, 0, 0, 0.1) 100%);
            border-radius: 50% 50% 10% 10%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 -2px 10px rgba(255,255,255,0.4);
            backdrop-filter: blur(2px);
        }
        .candle-glow {
            box-shadow: 0 0 40px 10px rgba(255, 160, 60, 0.3);
        }
        .candle-flame {
            background: radial-gradient(circle at center, #fff 0%, #ffd700 40%, #ff8c00 100%);
            filter: blur(1px);
        }
        .binder-clip {
            position: relative;
            width: 20px;
            height: 12px;
            background: #333;
            border-radius: 1px;
        }
        .binder-clip::before, .binder-clip::after {
            content: '';
            position: absolute;
            top: -6px;
            width: 8px;
            height: 10px;
            border: 1.5px solid #999;
            border-radius: 4px 4px 0 0;
            border-bottom: none;
        }
        .binder-clip::before { left: 2px; }
        .binder-clip::after { right: 2px; }
    </style>
</head>
<body class="bg-[#2c2c2c] font-sans h-screen overflow-hidden">
<div class="fixed inset-0 z-0 bg-black/40 backdrop-blur-sm"></div>
<main class="relative z-10 h-full w-full flex items-center justify-center p-8 perspective-2000">

<span class="material-symbols-outlined">arrow_back</span>
<span class="text-xs uppercase tracking-widest font-display">Back to Cabinet</span>
</a>

<div class="wood-texture p-6 border-2 border-black/30 shadow-inner relative min-h-[550px]">

<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-4 bg-zinc-400"></div>
<div class="absolute top-10 left-1 w-[1px] h-24 bg-white/10"></div>
</div>
<div class="w-3 h-44 bg-zinc-400 rounded-sm shadow-md relative -rotate-2">

<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-4 h-8 bg-zinc-600 rounded-sm"></div>
<div class="absolute top-8 left-1 w-[1px] h-20 bg-black/5"></div>
</div>
<div class="w-3 h-52 bg-zinc-700 rounded-sm shadow-md relative rotate-1">
<div class="absolute top-0 w-full h-4 bg-zinc-500 rounded-t-sm"></div>
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-4 h-14 bg-zinc-800 rounded-sm"></div>
</div>
</div>
<div class="compartment col-span-5 row-span-2 relative p-6 grid grid-cols-4 gap-4 items-center">
<div class="paperclip rotate-12 opacity-80"></div>
<div class="binder-clip bg-red-600 -rotate-45"></div>
<div class="paperclip -rotate-12 opacity-60"></div>
<div class="binder-clip bg-emerald-700 rotate-12"></div>
<div class="binder-clip bg-zinc-800 rotate-90"></div>
<div class="paperclip rotate-[140deg] opacity-70"></div>
<div class="binder-clip bg-blue-600 -rotate-12"></div>
<div class="paperclip rotate-45 border-orange-400"></div>
</div>
<div class="compartment col-span-2 row-span-2 relative flex items-center justify-center">
<div class="glass-paperweight w-16 h-16 relative">
<div class="absolute top-2 left-4 w-4 h-2 bg-white/40 blur-[1px] rounded-full rotate-[-30deg]"></div>
</div>
</div>
<div class="compartment col-span-3 row-span-2 relative flex items-center justify-center overflow-visible">
<div class="relative w-20 h-24 bg-zinc-200/10 border border-white/20 rounded-sm candle-glow backdrop-blur-[1px] flex flex-col justify-end p-2 overflow-hidden">
<div class="absolute bottom-0 left-0 w-full h-4/5 bg-yellow-100/30"></div>
<div class="absolute top-4 left-1/2 -translate-x-1/2 w-3 h-5 candle-flame rounded-full animate-pulse shadow-[0_0_15px_#ff8c00]"></div>
<div class="absolute top-9 left-1/2 -translate-x-1/2 w-[1.5px] h-2 bg-black"></div>
<div class="relative z-10 text-[6px] uppercase tracking-tighter text-white/40 font-mono text-center">MIMOSA SUBLIME</div>
</div>
</div>
<div class="col-span-8 row-span-4 relative flex items-center justify-center pt-2">
<div class="compartment absolute inset-0 -m-1 pointer-events-none opacity-40"></div>
<div class="paper-stack w-[90%] h-[92%] bg-[#FDFCF9] p-10 relative group cursor-pointer hover:scale-[1.005] transition-transform">
<div class="absolute top-4 right-8 text-gray-300 font-display text-[10px] uppercase tracking-widest">Memo 03-A</div>
<div class="space-y-6 pt-8">
<div class="h-[1px] bg-gray-100 w-full shadow-sm"></div>
<div class="h-[1px] bg-gray-100 w-full shadow-sm"></div>
<div class="h-[1px] bg-gray-100 w-full shadow-sm"></div>
<div class="h-[1px] bg-gray-100 w-full shadow-sm"></div>
<div class="h-[1px] bg-gray-100 w-full shadow-sm"></div>
</div>
<div class="mt-12 flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-gray-200 text-5xl mb-4">edit_note</span>
<p class="font-serif italic text-2xl text-gray-400">Leave a thought in the collective...</p>
</div>
<div class="absolute bottom-8 left-10 flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-gray-50 border border-gray-100 shadow-inner"></div>
<div class="h-2 w-32 bg-gray-50 rounded-full"></div>
</div>
</div>
</div>
<div class="compartment col-span-2 row-span-4 relative flex flex-col items-center justify-center gap-6 p-4">
<div class="w-16 h-12 bg-[#F4F1EA] rounded-sm shadow-md rotate-[-3deg] border border-black/5 flex flex-col items-center justify-center p-1">

<div class="w-10 h-[1px] bg-gray-200 mb-1"></div>

</div>
<div class="paperclip rotate-90 opacity-40"></div>

</div>
</div>
<div class="mt-4 h-16 bg-[#DCC6A1] border-t-2 border-black/15 flex flex-col items-center justify-center relative">

<div class="fixed bottom-12 left-12 opacity-50 text-white">
<h2 class="font-display text-2xl font-bold tracking-tighter uppercase">Drawer Archive</h2>

</div>
<div class="fixed bottom-12 right-12 text-white/50 font-display text-[10px] uppercase tracking-widest pointer-events-none">
            Select memo papers to contribute to the archive
        </div>
</main>
<nav class="fixed top-8 right-8 z-50">

</button>

</body></html>
