<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spacious Bedroom Layout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#d46211",
                        "wood-light": "#DCC6A1",
                        "wood-dark": "#7C6246",
                        "tray-gray": "#CBD5E1",
                        "tray-dark": "#334155",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221810"
                    },
                    fontFamily: {
                        display: "Montserrat",
                        sans: ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
<style type="text/tailwindcss">
        :root {
            --warm-light: rgba(255, 243, 224, 0.4);
            --lamp-glow: rgba(255, 180, 80, 0.35);
            --wood-grain: #e5d5bc;
            --table-warmth: #c86c05;
            --table-warmth-dark: #6a2f0d;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .cabinet-shadow {
            box-shadow: 15px 15px 50px rgba(0,0,0,0.2), -5px -5px 20px rgba(255,255,255,0.05);
        }
        .tray-content {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tray-trigger:hover .tray-content {
            transform: translateX(-32px) translateY(-4px);
            z-index: 50;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.15);
        }
        .bedroom-wall {
            background-color: #f4ece1;
            background-image: radial-gradient(#dcd3c1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .dark .bedroom-wall {
            background-color: #1e1b18;
            background-image: radial-gradient(#2d2924 1.5px, transparent 1.5px);
        }
        .lamp-glow-effect {
            background: radial-gradient(circle at center, var(--lamp-glow) 0%, transparent 70%);
        }
        .floor-texture {
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%),
                        repeating-linear-gradient(90deg, #d2b48c 0, #d2b48c 80px, #c1a37b 81px);
        }
        .dark .floor-texture {
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 100%),
                        repeating-linear-gradient(90deg, #2c241a 0, #2c241a 80px, #1a150f 81px);
        }
        .cabinet-lighting {
            background: linear-gradient(105deg, rgba(255,230,180,0.15) 0%, transparent 40%);
            pointer-events: none;
        }
        .wood-grain-texture {
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
                              linear-gradient(90deg, rgba(0,0,0,0.03) 0%, transparent 50%, rgba(0,0,0,0.03) 100%);
        }
        .striped-bedding {
            background: repeating-linear-gradient(90deg, #f8f8f8, #f8f8f8 6px, #dee2e6 6px, #dee2e6 12px);
        }
        .book-stack div:nth-child(odd) { background-color: #fefce8; border-left: 4px solid #991b1b; }
        .book-stack div:nth-child(even) { background-color: #f3f4f6; border-left: 4px solid #1e3a8a; }
    </style>
</head>
<body class="bg-stone-100 dark:bg-stone-950 font-sans overflow-hidden">
<main class="relative h-screen w-full flex flex-col items-center justify-end bedroom-wall transition-colors duration-700">
<div class="absolute left-[5%] bottom-[15%] w-48 h-64 z-10 hidden lg:block">
<div class="absolute bottom-0 w-full h-40 bg-[var(--table-warmth)] dark:bg-[var(--table-warmth-dark)] rounded-sm border-t border-white/20 shadow-2xl wood-grain-texture">
<div class="absolute top-4 left-1/2 -translate-x-1/2 w-32 h-1 bg-black/20 rounded"></div>
<div class="absolute top-12 left-1/2 -translate-x-1/2 w-4 h-4 rounded-full bg-stone-100/50 border border-black/20 shadow-inner"></div>
</div>
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-24 h-48 flex flex-col items-center">
<div class="w-20 h-24 bg-orange-50 dark:bg-stone-800 rounded-t-3xl border-x-2 border-t-2 border-orange-200/50 shadow-lg relative z-20 overflow-hidden">
<div class="absolute inset-0 lamp-glow-effect blur-xl"></div>
</div>
<div class="w-2 h-16 bg-stone-400 dark:bg-stone-700"></div>
<div class="w-16 h-4 bg-stone-400 dark:bg-stone-700 rounded-full"></div>
</div>
<div class="absolute -top-20 -left-20 w-80 h-80 bg-orange-300/30 dark:bg-orange-900/20 blur-[90px] rounded-full pointer-events-none"></div>
</div>
<div class="absolute right-0 translate-x-[25%] bottom-0 w-[45%] h-[55%] z-10 hidden lg:block">
<div class="w-full h-full bg-[#d4c1a5] dark:bg-[#4a3a2a] wood-grain-texture rounded-tl-lg border-l-4 border-t-4 border-white/20 shadow-2xl relative overflow-hidden">
<div class="absolute bottom-0 left-0 w-full h-[65%] striped-bedding shadow-inner border-t border-gray-300/50">
<div class="absolute -top-6 left-10 flex gap-4">
<div class="w-48 h-32 bg-sky-300/80 dark:bg-sky-900/40 rounded-3xl rotate-6 shadow-lg border border-sky-400/30"></div>
<div class="w-48 h-32 bg-sky-200/80 dark:bg-sky-800/40 rounded-3xl -rotate-3 shadow-lg border border-sky-300/30"></div>
</div>
</div>
<div class="absolute top-0 left-0 w-full h-[35%] bg-wood-light/95 dark:bg-wood-dark/95 border-b-4 border-black/10 flex items-end px-8 pb-3 gap-8">
<div class="book-stack flex flex-col-reverse items-center mb-1">
<div class="w-24 h-3 rounded-sm shadow-sm"></div>
<div class="w-22 h-4 rounded-sm shadow-sm -rotate-1"></div>
<div class="w-26 h-3 rounded-sm shadow-sm"></div>
<div class="w-20 h-5 rounded-sm shadow-sm rotate-1"></div>
<div class="w-24 h-4 rounded-sm shadow-sm"></div>
</div>
<div class="w-28 h-36 bg-stone-50 border-4 border-[#5d3e26] shadow-md mb-2 flex items-center justify-center overflow-hidden">
<div class="w-full h-full bg-gradient-to-tr from-stone-300 via-stone-200 to-stone-50 opacity-90 flex flex-col items-center justify-center p-2">
<div class="w-full h-1/2 bg-stone-400/40 rounded-sm mb-1"></div>
<div class="w-2/3 h-1/4 bg-stone-400/20 rounded-sm"></div>
</div>
</div>
<div class="book-stack flex flex-col-reverse items-center mb-1 opacity-90">
<div class="w-20 h-4 rounded-sm shadow-sm"></div>
<div class="w-24 h-3 rounded-sm shadow-sm rotate-2"></div>
<div class="w-22 h-4 rounded-sm shadow-sm"></div>
<div class="w-18 h-4 rounded-sm shadow-sm -rotate-1"></div>
</div>
</div>
<div class="absolute inset-0 pointer-events-none bg-gradient-to-br from-white/10 via-transparent to-transparent"></div>
</div>
</div>
<div class="absolute bottom-0 w-full h-[25vh] floor-texture z-0 border-t border-black/5"></div>
<div class="relative z-20 w-full max-w-lg mb-24 perspective-1000">
<div class="relative mx-auto w-[320px] sm:w-[400px] bg-wood-light dark:bg-wood-dark p-2 sm:p-3 rounded-sm cabinet-shadow border-t-2 border-l-2 border-white/20">
<div class="absolute inset-0 cabinet-lighting z-40 rounded-sm"></div>
<div class="h-4 w-full border-b border-black/10 flex items-center justify-center">
<div class="h-1 w-8 bg-black/20 rounded-full"></div>
</div>
<div class="h-10 flex items-center justify-center border-b border-black/10">
<div class="w-1 h-3 bg-black/40 rounded-full"></div>
</div>
<div class="space-y-1.5 mt-2 relative z-30">
<a class="tray-trigger block relative group" href="#">
<div class="tray-content h-10 sm:h-12 bg-tray-gray dark:bg-tray-dark flex items-center px-4 rounded-sm border-b border-black/10 group-hover:bg-slate-200 dark:group-hover:bg-slate-700">
<span class="text-xs sm:text-sm font-bold text-gray-600 dark:text-gray-400 w-8">1</span>
<span class="font-display font-medium text-gray-800 dark:text-gray-100 tracking-wider">WRITINGS</span>
</div>
</a>
<a class="tray-trigger block relative group" href="#">
<div class="tray-content h-10 sm:h-12 bg-tray-gray dark:bg-tray-dark flex items-center px-4 rounded-sm border-b border-black/10 group-hover:bg-slate-200 dark:group-hover:bg-slate-700">
<span class="text-xs sm:text-sm font-bold text-gray-600 dark:text-gray-400 w-8">2</span>
<span class="font-display font-medium text-gray-800 dark:text-gray-100 tracking-wider">PHOTOGRAPHY</span>
</div>
</a>
<a class="tray-trigger block relative group" href="#">
<div class="tray-content h-10 sm:h-12 bg-tray-gray dark:bg-tray-dark flex items-center px-4 rounded-sm border-b border-black/10 group-hover:bg-slate-200 dark:group-hover:bg-slate-700">
<span class="text-xs sm:text-sm font-bold text-gray-600 dark:text-gray-400 w-8">3</span>
<span class="font-display font-medium text-gray-800 dark:text-gray-100 tracking-wider uppercase">COMMUNITY</span>
</div>
</a>
<div class="tray-trigger relative group cursor-pointer">
<div class="tray-content h-8 sm:h-10 bg-tray-gray/80 dark:bg-tray-dark/80 flex items-center px-4 rounded-sm border-b border-black/10 group-hover:bg-white dark:group-hover:bg-slate-700">
<span class="text-[10px] sm:text-xs font-bold text-gray-500 dark:text-gray-400 w-8">4</span>
<span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-[10px] sm:text-xs font-display tracking-widest text-gray-400 uppercase">ARCHIVE</span>
</div>
</div>
<div class="tray-trigger relative group cursor-pointer">
<div class="tray-content h-8 sm:h-10 bg-tray-gray/80 dark:bg-tray-dark/80 flex items-center px-4 rounded-sm border-b border-black/10 group-hover:bg-white dark:group-hover:bg-slate-700">
<span class="text-[10px] sm:text-xs font-bold text-gray-500 dark:text-gray-400 w-8">5</span>
<span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-[10px] sm:text-xs font-display tracking-widest text-gray-400 uppercase">NOTES</span>
</div>
</div>
<div class="tray-trigger relative group cursor-pointer">
<div class="tray-content h-8 sm:h-10 bg-tray-gray/80 dark:bg-tray-dark/80 flex items-center px-4 rounded-sm border-b border-black/10 group-hover:bg-white dark:group-hover:bg-slate-700">
<span class="text-[10px] sm:text-xs font-bold text-gray-500 dark:text-gray-400 w-8">6</span>
<span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-[10px] sm:text-xs font-display tracking-widest text-gray-400 uppercase">ABOUT</span>
</div>
</div>
</div>
<div class="mt-4 pt-2 border-t-2 border-black/10">
<div class="h-10 sm:h-12 bg-wood-light/80 dark:bg-wood-dark/80 rounded-sm flex items-center justify-center">
<div class="w-12 h-1 bg-black/20 rounded-full"></div>
</div>
</div>
<div class="h-10 sm:h-12 mt-2 bg-[#4A5D4E] dark:bg-[#2D3A30] rounded-b-sm border-t border-black/10"></div>
</div>
<div class="absolute -bottom-8 left-1/2 -translate-x-1/2 w-[120%] h-12 bg-black/20 dark:bg-black/60 blur-2xl rounded-full"></div>
</div>
<nav class="fixed top-8 right-8 z-50 flex items-center gap-4">
<button class="p-2 rounded-full bg-white/80 dark:bg-black/20 backdrop-blur-md border border-gray-200 dark:border-gray-800 text-gray-800 dark:text-gray-200 hover:scale-110 transition-all" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined block dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>
</nav>
<div class="fixed bottom-8 right-8 text-stone-400 dark:text-stone-600 font-display text-[10px] uppercase tracking-widest pointer-events-none">
            Hover to explore drawers
        </div>
</main>

</body></html>
