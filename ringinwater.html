<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 물 링 던지기 게임</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: 'Arial', sans-serif;
        }

        #game-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 4/5;
            /* Deep Sea Gradient as fallback */
            background-color: #006994;
            background-image: url('images/bg.jpg'), linear-gradient(180deg, #00b4db 0%, #0083b0 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 12px solid #27ae60;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            margin-top: 20px;
        }

        #push-btn-left,
        #push-btn-right {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            font-size: 16px;
            margin: 0 20px;
        }

        #push-btn-left {
            background-color: #27ae60;
            box-shadow: 0 5px #1e8449;
        }

        #push-btn-right {
            background-color: #27ae60;
            box-shadow: 0 5px #1e8449;
        }

        #push-btn-left:active,
        #push-btn-right:active {
            transform: translateY(4px);
            box-shadow: 0 2px #1e8449;
        }

        .instruction {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="push-btn-left">L</button>
        <button id="push-btn-right">R</button>
    </div>
    <p class="instruction">버튼을 클릭하여 링을 막대에 끼워보세요!</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnLeft = document.getElementById('push-btn-left');
        const btnRight = document.getElementById('push-btn-right');

        canvas.width = 400;
        canvas.height = 500;

        // 환경 변수
        const gravity = 0.05;      // 중력
        const friction = 0.98;     // 물 저항 (속도 감소)
        const ringRadius = 15;
        const ringInnerRadius = 7;

        // 기울기 변수 (gamma: -90 ~ 90)
        let tiltAngle = 0;

        // 막대 설정 (2개)
        const poles = [
            { x: 130, y: 200, width: 10, height: 180 },
            { x: 270, y: 200, width: 10, height: 180 }
        ];

        // 링 객체 생성 (10개, 각기 다른 색상)
        const rings = [];
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#F333FF', '#FFFF33', '#FF8C00', '#00CED1', '#9400D3', '#FF1493', '#ADFF2F'];

        // 기포 객체 배열
        const bubbles = [];

        class Bubble {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 2; // 2~5px
                this.speed = Math.random() * 2 + 1; // 1~3 px/frame
                this.alpha = 1;
                this.wobble = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.alpha -= 0.01; // 천천히 투명해짐
                this.wobble += 0.1;
                this.x += Math.sin(this.wobble) * 0.5; // 좌우 흔들림
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        class Ring {
            constructor(index) {
                this.reset(index);
            }

            reset(index) {
                this.x = 50 + (index * 30);
                this.y = canvas.height - 40;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 0;
                this.color = colors[index];
                this.isHooked = false;
                this.targetPole = null;
            }

            update() {
                // 물리 법칙 적용 (공통)
                this.vy += gravity;
                this.vx *= friction;
                this.vy *= friction;

                // 기울기 물리 효과 적용
                // 왼쪽 기울기(gamma < 0) -> 왼쪽으로 힘 (오른쪽에서 압력)
                // 압력 세기: 기포 압력의 1/5 수준 (0.015)
                if (tiltAngle) {
                    this.vx += tiltAngle * 0.015;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.isHooked && this.targetPole) {
                    // 막대에 걸린 상태 로직
                    // X축: 막대 중심으로 강하게 보정 (자석처럼)
                    const poleCenter = this.targetPole.x + this.targetPole.width / 2;
                    this.x += (poleCenter - this.x) * 0.2; // 부드럽게 중심 이동

                    // 좌우 이동 범위 제한 (막대 중심으로부터 10px 이내)
                    const limit = 10;
                    if (this.x < poleCenter - limit) {
                        this.x = poleCenter - limit;
                        this.vx = 0; // 벽에 부딪힌 것처럼 속도 제거 (선택 사항)
                    } else if (this.x > poleCenter + limit) {
                        this.x = poleCenter + limit;
                        this.vx = 0;
                    }

                    // 탈출 조건: 링이 막대 위로 올라가면 unhook
                    if (this.y < this.targetPole.y - ringRadius) {
                        this.isHooked = false;
                        this.targetPole = null;
                    } else {
                        // 바닥/스택 충돌 로직
                        // 기본 바닥: 막대의 하단
                        let floorLimit = (this.targetPole.y + this.targetPole.height) - 10;

                        // 다른 링들과 충돌 체크 (스택 효과)
                        const stackSpacing = 14; // 링 두께 + 여유분

                        rings.forEach(other => {
                            // 같은 막대에 걸려있고, 나보다 아래에 있는 링을 찾음
                            if (other !== this && other.isHooked && other.targetPole === this.targetPole) {
                                if (other.y > this.y) {
                                    // 내 바닥은 '아래에 있는 링의 바로 위'가 되어야 함.
                                    // 여러 개가 있다면 그 중 가장 높은(Y값이 작은) 위치가 제한점이 됨.
                                    floorLimit = Math.min(floorLimit, other.y - stackSpacing);
                                }
                            }
                        });

                        if (this.y > floorLimit) {
                            this.y = floorLimit;
                            this.vy *= -0.2; // 바닥 탄성 감소
                        }
                    }
                } else {
                    // 자유 상태 로직

                    // 벽 충돌 (좌우)
                    if (this.x - ringRadius < 0) {
                        this.x = ringRadius;
                        this.vx *= -0.5;
                    } else if (this.x + ringRadius > canvas.width) {
                        this.x = canvas.width - ringRadius;
                        this.vx *= -0.5;
                    }

                    // 바닥 및 천장 충돌
                    if (this.y + ringRadius > canvas.height) {
                        this.y = canvas.height - ringRadius;
                        this.vy *= -0.3;
                    } else if (this.y - ringRadius < 0) {
                        this.y = ringRadius;
                        this.vy *= -0.3;
                    }

                    // 막대 걸림 판정
                    poles.forEach(pole => {
                        // 링 중심이 막대 범위 X 안에 있고
                        if (this.x > pole.x - 10 && this.x < pole.x + pole.width + 10) {
                            // 링이 막대 머리 부분(입구)을 지나고 있을 때
                            // 막대 y좌표 근처에서 속도가 아래로 향할 때 hook
                            if (this.y > pole.y && this.y < pole.y + 30) {
                                if (this.vy > 0) {
                                    this.isHooked = true;
                                    this.targetPole = pole;
                                }
                            }
                        }
                    });
                }
            }

            draw() {
                // Draw striped ring (Side View / Oval)
                const segments = 8;
                const segmentAngle = (Math.PI * 2) / segments;
                const rx = 22; // Wider X radius
                const ry = 8;  // Flattened Y radius for perspective

                for (let i = 0; i < segments; i++) {
                    ctx.beginPath();
                    ctx.ellipse(this.x, this.y, rx, ry, 0, i * segmentAngle, (i + 1) * segmentAngle);
                    ctx.strokeStyle = i % 2 === 0 ? '#e67e22' : '#ecf0f1'; // Orange and White
                    ctx.lineWidth = 10; // Thicker line to simulate volume
                    ctx.stroke();
                }

                // Add a subtle highlight to make it look 3D (Optional)
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            applyPush(direction) {
                // 깊이에 따른 압력 조절
                // 화면 아래(y=500 내외)일수록 1.0에 가깝고, 위(y=0)로 갈수록 약해짐 (최소 0.2 정도)
                // 이를 통해 고리에 걸린 링이 쉽게 빠지지 않도록 함

                const depthRatio = Math.max(0, Math.min(1, this.y / canvas.height));
                // 위쪽에서는 힘이 30%, 아래쪽에서는 100%
                const pressureMultiplier = 0.3 + (depthRatio * 0.7);

                // 기본 솟구치는 힘
                const baseForce = Math.random() * 3 + 2;
                this.vy -= baseForce * pressureMultiplier;

                // 방향에 따른 추가 힘 (X축, Y축)
                // 이 또한 압력의 영향을 받아 약해져야 함
                if (direction === 'left') {
                    this.vx += (Math.random() * 2) * pressureMultiplier;
                    this.vy -= (Math.random() * 2) * pressureMultiplier;
                } else {
                    this.vx -= (Math.random() * 2) * pressureMultiplier;
                    this.vy -= (Math.random() * 2) * pressureMultiplier;
                }
            }
        }

        // 초기 링 생성
        for (let i = 0; i < 10; i++) {
            rings.push(new Ring(i));
        }

        function spawnBubbles(side) {
            const count = 10; // 한번에 발생할 기포 수
            for (let i = 0; i < count; i++) {
                // 위치: 바닥 근처, 왼쪽 버튼이면 왼쪽 영역, 오른쪽이면 오른쪽 영역
                let startX;
                if (side === 'left') {
                    startX = Math.random() * (canvas.width / 2);
                } else {
                    startX = (canvas.width / 2) + Math.random() * (canvas.width / 2);
                }
                bubbles.push(new Bubble(startX, canvas.height + 10)); // 화면 아래에서 시작
            }
        }

        function drawPoles() {
            ctx.fillStyle = '#f1c40f';
            poles.forEach(pole => {
                // 막대 본체 (Vertical Stem)
                ctx.fillRect(pole.x, pole.y, pole.width, pole.height);

                // 하단 받침대 설정 (역 T자 형태)
                const barWidth = 30;
                const barHeight = 8;

                // 하단 가로바 (Bottom Bar Only)
                ctx.fillRect(pole.x - (barWidth - pole.width) / 2, pole.y + pole.height - barHeight, barWidth, barHeight);
            });
        }

        function drawWaterEffect() {
            // 물결이나 기포 느낌 (선택 사항)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 기포 업데이트 및 그리기
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                b.draw();
                if (b.alpha <= 0 || b.y < -10) {
                    bubbles.splice(i, 1);
                }
            }

            drawPoles();

            rings.forEach(ring => {
                ring.update();
                ring.draw();
            });

            requestAnimationFrame(animate);
        }

        // 일반적인 디바이스 오리엔테이션 리스너 (Android 등 권한 요청이 필요 없는 경우)
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
            window.addEventListener('deviceorientation', (event) => {
                // gamma가 null일 수 있으므로 체크
                if (event.gamma !== null) tiltAngle = event.gamma;
            });
        }

        let permissionRequested = false;

        const handlePush = (direction, e) => {
            if (e && e.cancelable) e.preventDefault(); // 다중 터치/클릭 방지 및 스크롤 방지

            // iOS 13+ DeviceOrientation 권한 요청
            if (!permissionRequested &&
                typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {

                permissionRequested = true;
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', (event) => {
                                if (event.gamma !== null) tiltAngle = event.gamma;
                            });
                        }
                    })
                    .catch(console.error);
            }

            rings.forEach(ring => ring.applyPush(direction));

            // 기포 생성 효과 추가
            spawnBubbles(direction);
        };

        // 마우스 클릭 이벤트
        btnLeft.addEventListener('mousedown', (e) => handlePush('left', e));
        btnRight.addEventListener('mousedown', (e) => handlePush('right', e));

        // 모바일 터치 이벤트 (지연 시간 제거)
        btnLeft.addEventListener('touchstart', (e) => handlePush('left', e), { passive: false });
        btnRight.addEventListener('touchstart', (e) => handlePush('right', e), { passive: false });

        animate();
    </script>
</body>

</html>
