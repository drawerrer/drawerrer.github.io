<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GW6KD4C2P"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-3GW6KD4C2P');
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" type="image/png" href="assets/Favicon.png" />
    <link rel="apple-touch-icon" href="assets/Favicon.png" />
    <title>Portfolio Viewer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;family=Mrs+Saint+Delafield&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script>
        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#d46211",
                        "wood-light": "#DCC6A1",
                        "wood-dark": "#7C6246",
                        "tray-gray": "#CBD5E1",
                        "tray-dark": "#2C353F",
                    },
                    fontFamily: {
                        display: ["Pretendard Variable", "Pretendard", "sans-serif"],
                        serif: ["Pretendard Variable", "Pretendard", "serif"],
                        sans: ["Pretendard Variable", "Pretendard", "sans-serif"],
                        script: ["Caveat", "cursive"],
                        elegant: ["Mrs Saint Delafield", "cursive"],
                    }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#Fdfcf0] dark:bg-zinc-950 font-sans h-screen overflow-hidden transition-colors duration-1000">
    <div id="app-content" class="w-full h-full">
        <!-- Main Portfolio View -->
        <div class="relative w-full h-full flex flex-col">
            <!-- Header navigation -->
            <header class="flex-none p-4 md:px-8 py-5 flex items-center justify-between border-b border-black/10 dark:border-white/10 bg-white/50 dark:bg-black/20 backdrop-blur-md z-50">
                <a class="flex items-center gap-2 text-stone-700 hover:text-stone-900 dark:text-stone-300 dark:hover:text-white transition-colors group"
                   href="blog.html">
                    <span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    <span class="font-display text-sm tracking-widest font-medium uppercase hidden sm:block">Back</span>
                </a>
                
                <h1 class="font-display text-sm md:text-base tracking-[0.3em] font-medium text-gray-800 dark:text-gray-200">PORTFOLIO</h1>
                
                <button
                    class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
                    onclick="toggleTheme()">
                    <span class="material-symbols-outlined block dark:hidden text-stone-800">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:block text-stone-200">light_mode</span>
                </button>
            </header>

            <!-- PDF Iframe Container -->
            <main class="flex-1 w-full relative z-10 bg-stone-100/50 dark:bg-stone-900/50 flex flex-col items-center justify-center p-0 sm:p-4 md:p-8">
                <!-- Wrapper for the iframe for nice dropshadow depending on viewport -->
                <div class="w-full h-full max-w-6xl mx-auto sm:rounded-xl shadow-none sm:shadow-2xl overflow-hidden bg-white dark:bg-zinc-800 border border-transparent sm:border-black/5 sm:dark:border-white/10 flex flex-col">
                    <iframe src="assets/Portfolio.pdf" class="w-full flex-1 border-0 bg-white dark:bg-stone-800" title="Portfolio PDF Viewer"></iframe>
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import { initMusicPlayer } from './js/music-player.js';
        
        // Ensure router doesn't crash when visiting portfolio.html directly (if router was added globally)
        // Usually initRouter is only in blog.html, but let's see. 
        initMusicPlayer();
    </script>
</body>
</html>
