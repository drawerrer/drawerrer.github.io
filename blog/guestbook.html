<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Guest's Drawer | 영유의 서랍장</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/guestbook.css">
</head>
<body>

    <main class="page-container guestbook-container">
        
        <!-- Back Link -->
        <a href="index.html" class="back-link">
            <span class="material-symbols-outlined" style="font-size: 1.2rem;">arrow_back</span>
            서랍장으로 돌아가기
        </a>

        <!-- Header -->
        <header class="page-header">
            <h1 class="page-title">The Guest's Drawer</h1>
            <p class="page-subtitle">이 공간에 다녀간 흔적을 자유롭게 남겨주세요.</p>
        </header>

        <div class="guestbook-layout">
            
            <!-- Write Section -->
            <section class="write-section">
                <h2>Leave a Note</h2>
                <form id="guestbookForm" class="guestbook-form">
                    <div class="form-group">
                        <input type="text" id="visitorName" placeholder="당신의 이름이나 별명" required maxlength="30">
                    </div>
                    <div class="form-group">
                        <textarea id="visitorMessage" placeholder="남기고 싶은 말을 적어주세요." required maxlength="300"></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">메모 남기기</button>
                </form>
            </section>

            <!-- Notes Section -->
            <section>
                <div class="notes-grid" id="guestbookList">
                    <!-- Javascript will inject notes here -->
                </div>
            </section>

        </div>

    </main>

    <!-- Supabase Logic -->
    <script type="module">
        import { supabase } from 'js/supabase-config.js';

        const guestbookForm = document.getElementById('guestbookForm');
        const guestbookList = document.getElementById('guestbookList');
        const submitBtn = document.getElementById('submitBtn');

        // Some preset dark theme card colors to keep it varied but matching dark mode
        const cardColors = ['#2a2a2a', '#2c2a26', '#252a2b', '#2a2528'];

        async function loadMessages() {
            try {
                const { data: messages, error } = await supabase
                    .from('guestbook')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                guestbookList.innerHTML = '';

                if (!messages || messages.length === 0) {
                    guestbookList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px 0;">아직 남겨진 메모가 없습니다. 첫 번째 메모를 남겨보세요!</div>';
                    return;
                }

                messages.forEach((note) => {
                    const dateStr = note.created_at ? new Date(note.created_at).toLocaleDateString() : (note.date || '');
                    
                    const el = document.createElement('div');
                    el.className = 'note-card';
                    
                    // Assign random color and slight rotation for organic feel
                    const color = cardColors[Math.floor(Math.random() * cardColors.length)];
                    const rotation = (Math.random() * 4) - 2; // -2 to +2 degrees
                    
                    el.style.backgroundColor = color;
                    el.style.transform = `rotate(${rotation}deg)`;

                    // Sanitize output to prevent XSS
                    const safeName = escapeHTML(note.name);
                    const safeMessage = escapeHTML(note.message).replace(/\n/g, '<br>');

                    el.innerHTML = `
                        <div class="note-meta">
                            <span>MEMO</span>
                            <span>${dateStr}</span>
                        </div>
                        <div class="note-content">${safeMessage}</div>
                        <div class="note-author">- ${safeName}</div>
                    `;
                    
                    guestbookList.appendChild(el);
                });
            } catch (err) {
                console.error('Error fetching guestbook:', err);
                guestbookList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #ff6b6b; padding: 40px 0;">메시지를 불러오는데 실패했습니다.</div>';
            }
        }

        guestbookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('visitorName');
            const messageInput = document.getElementById('visitorMessage');
            
            const name = nameInput.value.trim();
            const message = messageInput.value.trim();
            
            if(!name || !message) return;

            submitBtn.disabled = true;
            submitBtn.innerText = '저장 중...';

            try {
                const { error } = await supabase.from('guestbook').insert([{
                    name,
                    message,
                    date: new Date().toLocaleDateString('en-CA').replace(/-/g, '.')
                }]);

                if (error) throw error;

                // Success
                nameInput.value = '';
                messageInput.value = '';
                loadMessages(); // reload
            } catch (err) {
                console.error('Error signing guestbook:', err);
                alert('메모를 남기는데 실패했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '메모 남기기';
            }
        });

        // Helper to prevent XSS
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        // Init
        loadMessages();
    </script>
    <script src="js/transition.js"></script>
</body>
</html>
