    <script>
        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>

    <script src="js/script.js"></script>
    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, getDocs, addDoc, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const folderView = document.getElementById('folderView');
        const stampListContainer = document.getElementById('stampListContainer');
        const readingView = document.getElementById('readingView');
        const docTitle = document.getElementById('docTitle');
        const docDateDisplay = document.getElementById('docDateDisplay');
        const commentList = document.getElementById('commentList');
        const commentCount = document.getElementById('commentCount');
        const commentForm = document.getElementById('commentForm');
        const docContent = document.getElementById('docContent');

        let currentDocId = '';
        let cachedEssays = {}; // { id: data }

        // Make functions globally available for HTML onclick attributes
        window.closeReadingView = closeReadingView;
        window.openReadingView = openReadingView; // Added this as it's called from onclick

        // Palette from reference
        const palette = [
            '#CCA43B', // Mustard
            '#A4B8E0', // Periwinkle
            '#E8E0D0', // Cream
            '#F0EAD6', // Light Yellow
            '#A4C639', // Lime
            '#E97451', // Salmon
            '#4B3621'  // Dark Brown
        ];

        window.addEventListener('DOMContentLoaded', loadFolders);

        async function loadFolders() {
            stampListContainer.innerHTML = '<div class="text-center pt-10 text-stone-500 italic">Loading archive...</div>';

            try {
                // Fetch essays from Firestore (Newest first)
                // We use 'createdAt' for reliable sorting. If missing (legacy), it might be excluded, 
                // so we can fallback or just rely on new data being correct.
                const q = query(collection(db, "essays"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                cachedEssays = {};
                const sortedEssays = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    cachedEssays[doc.id] = data;
                    sortedEssays.push({ id: doc.id, ...data });
                });

                stampListContainer.innerHTML = '';

                if (sortedEssays.length === 0) {
                    stampListContainer.innerHTML = '<div class="text-center pt-10 text-stone-500 italic">No essays found.</div>';
                    return;
                }

                sortedEssays.forEach((essay, index) => {
                    const color = palette[index % palette.length];
                    const strip = document.createElement('div');

                    // Styling
                    strip.className = "ticket-strip w-full h-16 flex items-center justify-between px-6 md:px-12 cursor-pointer hover:brightness-110 transition-all -mt-[2px] relative z-0 hover:z-10";
                    strip.style.backgroundColor = color;
                    strip.onclick = () => openReadingView(essay.id);

                    // Stage text: Archive 01, 02... based on index? 
                    // If we sort desc, index 0 is newest. 
                    // If we want Archive 01 to be oldest, we need total count - index? 
                    // Let's just use index+1 for now.
                    const stageText = `ARCHIVE ${String(index + 1).padStart(2, '0')}`;

                    strip.innerHTML = `
                        <div class="flex items-center gap-8 w-full">
                            <span class="font-mono text-[10px] uppercase tracking-widest opacity-60 w-20 shrink-0 border-b border-black/10 pb-1">${stageText}</span>
                            <span class="font-bold text-sm md:text-base uppercase tracking-wider text-stone-800/90 truncate flex-1 block text-center">${essay.title}</span>
                             <span class="font-mono text-[10px] uppercase tracking-widest opacity-60 w-20 shrink-0 text-right border-b border-black/10 pb-1">${essay.date}</span>
                        </div>
                    `;

                    stampListContainer.appendChild(strip);
                });
            } catch (error) {
                console.error("Error loading essays:", error);
                alert("Error loading writings: " + error.message); // Added for debugging
                stampListContainer.innerHTML = '<div class="text-center pt-10 text-red-500 italic">Failed to load archive.</div>';
            }
        }


        function openReadingView(id) {
            folderView.classList.add('opacity-0');
            setTimeout(() => {
                folderView.classList.add('hidden');
                readingView.classList.remove('hidden');
                readingView.querySelector('div').scrollTop = 0;

                setTimeout(() => {
                    readingView.classList.remove('opacity-0');
                    loadEssayContent(id);
                }, 50);
            }, 500);
        }

        function closeReadingView() {
            readingView.classList.add('opacity-0');
            setTimeout(() => {
                readingView.classList.add('hidden');
                folderView.classList.remove('hidden');
                setTimeout(() => {
                    folderView.classList.remove('opacity-0');
                }, 50);
            }, 500);
        }

        async function loadEssayContent(id) {
            const essay = cachedEssays[id];
            if (essay) {
                currentDocId = id;
                docTitle.textContent = essay.title;
                docDateDisplay.textContent = essay.date;
                docContent.innerHTML = essay.content;
                loadComments(id);
            }
        }

        async function loadComments(docId) {
            commentList.innerHTML = '<p class="text-center text-xs text-stone-400 italic">Loading comments...</p>';

            try {
                // Fetch comments from subcollection 'comments'
                const commentsRef = collection(db, "essays", docId, "comments");
                const q = query(commentsRef, orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);

                commentList.innerHTML = '';
                commentCount.textContent = querySnapshot.size;

                if (querySnapshot.empty) {
                    commentList.innerHTML = '<p class="text-center text-xs text-stone-400 italic">No comments yet.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const comment = doc.data();
                    const date = comment.createdAt ? comment.createdAt.toDate().toLocaleDateString() : 'Just now';

                    const el = document.createElement('div');
                    el.className = 'border-b border-black/5 pb-4 last:border-0';
                    el.innerHTML = `
                        <div class="flex justify-between items-baseline mb-2">
                            <span class="font-bold text-sm text-stone-800 dark:text-stone-200">${comment.name}</span>
                            <span class="text-[10px] text-stone-400 font-mono">${date}</span>
                        </div>
                        <p class="text-sm text-stone-600 dark:text-stone-400 leading-relaxed font-serif">${comment.content}</p>
                    `;
                    commentList.appendChild(el);
                });
            } catch (error) {
                console.error("Error loading comments:", error);
                commentList.innerHTML = '<p class="text-center text-xs text-red-400 italic">Error loading comments.</p>';
            }
        }

        commentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(commentForm);
            const name = formData.get('name');
            const password = formData.get('password'); // Note: storing password in plain text for this demo/MVP as per user logic
            const content = formData.get('content');

            if (!currentDocId) return;

            try {
                await addDoc(collection(db, "essays", currentDocId, "comments"), {
                    name,
                    password,
                    content,
                    createdAt: serverTimestamp()
                });

                commentForm.reset();
                loadComments(currentDocId); // Reload comments
            } catch (error) {
                console.error("Error adding comment:", error);
                alert("Failed to post comment.");
            }
        });
    </script>
