        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>

    <script>
        const folderView = document.getElementById('folderView');
        const stampListContainer = document.getElementById('stampListContainer');
        const readingView = document.getElementById('readingView');
        const docTitle = document.getElementById('docTitle');
        const docDateDisplay = document.getElementById('docDateDisplay');
        const commentList = document.getElementById('commentList');
        const commentCount = document.getElementById('commentCount');
        const commentForm = document.getElementById('commentForm');
        const docContent = document.getElementById('docContent');

        let currentDocId = '';

        // Initial Data
        const commentsData = JSON.parse(localStorage.getItem('commentsData')) || {};

        // Palette from reference
        const palette = [
            '#CCA43B', // Mustard
            '#A4B8E0', // Periwinkle
            '#E8E0D0', // Cream
            '#F0EAD6', // Light Yellow
            '#A4C639', // Lime
            '#E97451', // Salmon
            '#4B3621'  // Dark Brown (Should match footer if last?)
        ];

        window.addEventListener('DOMContentLoaded', loadFolders);

        function loadFolders() {
            let essays = JSON.parse(localStorage.getItem('essaysData'));
            if (!essays) {
                loadEssayContent('');
                essays = JSON.parse(localStorage.getItem('essaysData'));
            }

            // Generate HTML
            // Sort by Date Ascending (Oldest = Index 0 = Front/Bottom)
            const sortedEssays = Object.values(essays).sort((a, b) => new Date(a.date) - new Date(b.date));

            // Re-sort after potential update (though content update doesn't affect sort)
            // ... existing loop ...

            stampListContainer.innerHTML = '';

            sortedEssays.forEach((essay, index) => {
                const color = palette[index % palette.length];
                const strip = document.createElement('div');

                // Styling
                strip.className = "ticket-strip w-full h-16 flex items-center justify-between px-6 md:px-12 cursor-pointer hover:brightness-110 transition-all -mt-[2px] relative z-0 hover:z-10";
                strip.style.backgroundColor = color;
                strip.onclick = () => openReadingView(essay.title);

                const stageText = `ARCHIVE ${String(index + 1).padStart(2, '0')}`;

                // Inner HTML matching reference style
                strip.innerHTML = `
                    <div class="flex items-center gap-8 w-full">
                        <span class="font-mono text-[10px] uppercase tracking-widest opacity-60 w-20 shrink-0 border-b border-black/10 pb-1">${stageText}</span>
                        <span class="font-bold text-sm md:text-base uppercase tracking-wider text-stone-800/90 truncate flex-1 block text-center">${essay.title}</span>
                         <span class="font-mono text-[10px] uppercase tracking-widest opacity-60 w-20 shrink-0 text-right border-b border-black/10 pb-1">${essay.date}</span>
                    </div>
                `;

                stampListContainer.appendChild(strip);
            });
        }


        function openReadingView(title) {
            folderView.classList.add('opacity-0');
            setTimeout(() => {
                folderView.classList.add('hidden');
                readingView.classList.remove('hidden');

                // Reset scroll
                readingView.querySelector('div').scrollTop = 0;

                setTimeout(() => {
                    readingView.classList.remove('opacity-0');
                    loadEssayContent(title);
                }, 50);
            }, 500);
        }

        function closeReadingView() {
            readingView.classList.add('opacity-0');
            setTimeout(() => {
                readingView.classList.add('hidden');
                folderView.classList.remove('hidden');
                setTimeout(() => {
                    folderView.classList.remove('opacity-0');
                }, 50);
            }, 500);
        }

        function loadEssayContent(title) {
            let essays = JSON.parse(localStorage.getItem('essaysData'));
            // ... (Default initialization logic if empty - same as before) ...
            if (!essays) {
                const defaultEssays = {
                    '첫 인사': {
                        title: '첫 인사',
                        date: '2025.10.12',
                        content: `<p class="drop-cap text-stone-900 leading-relaxed font-serif text-justify text-base">
                            어제 아침은 문밖이 소란스러웠다. 그렇다는 건 나를 빼고 모두가 일어나서 각자 할 일을 하고 있다는 의미였다. 왠지 나만 손해 보고 있는 것 같은 기분으로 침대 밖으로 몸을 던지다시피 일어났다. 일찍 일어나야 한다는 나의 의지는 몇 년 새 집착에 가까울 정도다. 가끔 9시가 넘어서 일어나는 날이면 아침 시간을 허비한 것 같은 기분이 든다. 누가 정해둔 것도 아닌데 나는 왜 이른 아침에 일어나는 걸 고집하는 걸까?
                            </p>
                            <p class="text-stone-900 leading-relaxed font-serif text-justify text-base mt-6">
                            많은 미디어에서 일찍 일어나는 것을 성공의 비결로 꼽곤 한다. 모 유명 강사의 유명한 일화도 있다. 학원 운영이 어려워져 빚을 못 갚을까 두려워하던 시절, 살다가 겁이 나면 일찍 일어나라는 어머니의 말씀을 듣고 1년 반 동안 새벽 4시 반에 일어나서 학부모들께 편지를 썼던 이야기. 이후 학원은 200명의 학생이 다닐 정도로 흥행했다고. 몇 년 전 유행했던 ‘미라클 모닝’을 기억하는가? 그때 많은 사람들이 새벽 4시에 일어나며 인증샷을 SNS에 올리는 열풍이 불곤 했다. 이처럼 일찍 일어나야 성공할 수 있다는 의식이 많은 사람의 기저에 깔린 것이다.
                            </p>
                             <p class="text-stone-900 leading-relaxed font-serif text-justify text-base mt-6">
                            나도 일찍 일어나야 성공할 수 있다고 믿는 사람들 중 하나다. 다만 그 믿음은 가끔 나를 괴롭게 하기도 한다. 성공의 반대말은 무엇이냐, 바로 실패다. 나는 일찍 일어나지 못하면 실패한다고 생각한다. 이건 어떤 사실을 말하는 게 아니다. 내가 일찍 일어나지 못하면 실패할지도 모른다는 불안감을 느낀다는 걸 의미한다. 내가 자는 동안 세상에서 어떤 중요한 일들이 일어나기라도 하는 듯 말이다. 공부를 자극하는 명언에는 그런 것도 있다. 네가 자는 동안 꿈을 꾸지만, 어떤 이들은 깨어서 그 꿈을 이룬다. 내가 일찍 일어나지 못한 시간만큼 남들보다 뒤처진다는 생각에 불을 붙이는 문장이다.
                            </p>
                            <p class="text-stone-900 leading-relaxed font-serif text-justify text-base mt-6">
                            그런 불안감이 수년간 나를 아침 일찍 일어나야 하는 사람으로 만들었다. 오늘만 해도 그렇다. 평소보다 일찍 잠자리에 든 탓인지 눈이 빨리 떠졌다. 핸드폰을 확인하니 4시 53분. 첫 알람을 6시로 맞춰뒀으니 1시간이나 더 잘 수 있는 시간이었다. 잠에 들기 위해서 최신 IT 트렌드 관련 기사를 읽고 있는데 그게 트리거가 되었는지 요즘 진행하고 있는 프로젝트가 생각났다. 안 그래도 어젯밤에 내 실력을 한탄하는 내용의 글을 적었는데 다시금 불안해지는 것이다. 함께 프로젝트를 하는 사람 중 내가 제일 뒤처지고 있다는 생각. 그 생각이 나를 일으켜 세우고 책상 앞에 앉아서 글을 쓰게 만들었다.
                            </p>`
                    }
                };
                localStorage.setItem('essaysData', JSON.stringify(defaultEssays));
                essays = defaultEssays;
            }

            if (!title && Object.keys(essays).length > 0) return;

            const essay = essays[title];
            if (essay) {
                currentDocId = title;
                docTitle.textContent = essay.title;
                docDateDisplay.textContent = essay.date;
                docContent.innerHTML = essay.content;
                renderComments(title);
            }
        }

        // ... Comment functions (renderComments, deleteComment, submit listener) ...
        // Re-paste existing comment logic below or ensure it's preserved

        function renderComments(docId) {
            commentList.innerHTML = '';
            const comments = commentsData[docId] || [];
            commentCount.textContent = comments.length;

            if (comments.length === 0) {
                commentList.innerHTML = '<p class="text-center text-xs text-stone-400 italic">No comments yet.</p>';
                return;
            }

            comments.forEach(comment => {
                const el = document.createElement('div');
                el.className = 'border-b border-black/5 pb-4 last:border-0';
                el.innerHTML = `
                    <div class="flex justify-between items-baseline mb-2">
                        <span class="font-bold text-sm text-stone-800 dark:text-stone-200">${comment.name}</span>
                        <span class="text-[10px] text-stone-400 font-mono">${new Date(comment.date).toLocaleDateString()}</span>
                    </div>
                    <p class="text-sm text-stone-600 dark:text-stone-400 leading-relaxed font-serif">${comment.content}</p>
                `;
                commentList.appendChild(el);
            });
        }

        commentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(commentForm);
            const name = formData.get('name');
            const password = formData.get('password');
            const content = formData.get('content');

            if (!commentsData[currentDocId]) {
                commentsData[currentDocId] = [];
            }

            const newComment = {
                id: Date.now(),
                name,
                password, // In real app, hash this!
                content,
                date: new Date().toISOString()
            };

            commentsData[currentDocId].push(newComment);
            localStorage.setItem('commentsData', JSON.stringify(commentsData));

            renderComments(currentDocId);
            commentForm.reset();
        });
    </script>
