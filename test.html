<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>정밀 튜닝된 수중 링 던지기</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 520px;
            background: linear-gradient(180deg, #24c6dc 0%, #514a9d 100%);
            border: 12px solid #2ecc71;
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 45px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .push-btn {
            width: 75px;
            height: 75px;
            border: 4px solid rgba(255, 215, 0, 0.7);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            transition: all 0.1s;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }

        .push-btn:active {
            transform: scale(0.85) translateY(6px);
            background: rgba(255, 230, 0, 0.5);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .instruction {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button class="push-btn" id="btn-left">PUSH</button>
            <button class="push-btn" id="btn-right">PUSH</button>
        </div>
    </div>
    <p class="instruction">기울기 센서와 멀티 터치를 지원합니다.</p>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    canvas.width = 360;
    canvas.height = 520;

    // 물리 상수 튜닝
    const gravity = 0.045; // 링이 천천히 가라앉도록 하향
    const friction = 0.98; // 물 저항
    let tiltX = 0;

    const poles = [
        { x: 100, y: 190, width: 12, height: 230 },
        { x: 260, y: 190, width: 12, height: 230 }
    ];

    class Bubble {
        constructor(side) {
            this.x = (side === 'left' ? 30 + Math.random() * 120 : 210 + Math.random() * 120);
            this.y = canvas.height + 10;
            this.radius = Math.random() * 3 + 2;
            this.speedY = Math.random() * 3 + 5;
            this.wobble = Math.random() * 10;
            this.alpha = 0.7;
        }
        update() {
            this.y -= this.speedY;
            this.wobble += 0.15;
            this.x += Math.sin(this.wobble) * 2;
            this.alpha -= 0.008;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    class Ring {
        constructor(index) {
            this.color = ['#FFD700', '#FF7F50', '#E0FFFF', '#FF69B4', '#00FFFF'][index % 5];
            this.reset(index);
        }

        reset(index) {
            this.x = 80 + (index * 22);
            this.y = canvas.height - 30;
            this.vx = 0;
            this.vy = 0;
            this.angleZ = Math.random() * Math.PI; // 좌우 회전
            this.angleX = 0; // 텀블링 (앞뒤 회전)
            this.vAngleZ = 0;
            this.vAngleX = 0;
            this.isHooked = false;
            this.targetPole = null;
        }

        update() {
            this.vy += gravity;
            this.vx += tiltX * 0.04;
            this.vx *= friction;
            this.vy *= friction;
            this.x += this.vx;
            this.y += this.vy;

            this.angleZ += this.vAngleZ;
            this.angleX += this.vAngleX;
            this.vAngleZ *= 0.95;
            this.vAngleX *= 0.95;

            // 바닥/막대 안착 시 링이 측면(Flat)을 보이도록 강제하는 로직
            if (this.isHooked || this.y > canvas.height - 35) {
                this.angleX *= 0.75; // 회전각을 0으로 급격히 수렴시킴
                this.vAngleX *= 0.7;
                if(Math.abs(this.angleX) < 0.01) this.angleX = 0;
            }

            if (this.isHooked) {
                const poleCenter = this.targetPole.x + this.targetPole.width / 2;
                this.x += (poleCenter - this.x) * 0.25;
                
                // 스택 계산 (정교한 10px 간격)
                let floorLimit = canvas.height - 28;
                rings.forEach(other => {
                    if (other !== this && other.isHooked && other.targetPole === this.targetPole) {
                        if (other.y > this.y) {
                            floorLimit = Math.min(floorLimit, other.y - 11);
                        }
                    }
                });

                if (this.y > floorLimit) {
                    this.y = floorLimit;
                    this.vy *= -0.1;
                    this.vx = 0;
                }

                // 탈출 조건
                if (this.y < this.targetPole.y - 15) {
                    this.isHooked = false;
                    this.targetPole = null;
                }
            } else {
                // 경계선 처리
                if (this.x < 22) { this.x = 22; this.vx *= -0.4; }
                if (this.x > canvas.width - 22) { this.x = canvas.width - 22; this.vx *= -0.4; }
                if (this.y > canvas.height - 25) { 
                    this.y = canvas.height - 25; 
                    this.vy *= -0.2; 
                }
                if (this.y < 22) { this.y = 22; this.vy *= -0.4; }

                // 걸림 판정
                poles.forEach(pole => {
                    const poleCX = pole.x + pole.width/2;
                    if (Math.abs(this.x - poleCX) < 18) {
                        if (this.y > pole.y && this.y < pole.y + 35 && this.vy > 0) {
                            this.isHooked = true;
                            this.targetPole = pole;
                        }
                    }
                });
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angleZ);
            
            const rx = 22;
            // angleX가 0일 때 ry가 최소(7)가 되어 납작한 측면을 보여줌
            const ry = 7 + (14 * Math.abs(Math.sin(this.angleX)));

            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, i * (Math.PI/4), (i+1) * (Math.PI/4));
                ctx.strokeStyle = i % 2 === 0 ? this.color : '#FFFFFF';
                ctx.lineWidth = 7;
                ctx.stroke();
            }
            ctx.restore();
        }

        applyPush(side) {
            const dist = Math.abs(this.x - (side === 'left' ? 80 : 280));
            const power = Math.max(0, 1 - dist / 320);
            
            // 기존 5~10 범위에서 3~6 범위로 압력 하향 조정
            const pushPower = (Math.random() * 3 + 3.5) * power;
            this.vy -= pushPower;
            this.vx += (side === 'left' ? 1.2 : -1.2) * (Math.random() * 3) * power;
            
            this.vAngleZ = (Math.random() - 0.5) * 0.4;
            this.vAngleX = Math.random() * 0.35;
        }
    }

    const rings = Array.from({ length: 10 }, (_, i) => new Ring(i));
    const bubbles = [];

    function drawPoles() {
        poles.forEach(pole => {
            // 기둥 그림자
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(pole.x + 4, pole.y, pole.width, canvas.height - pole.y);

            // 기둥 (금속 그라데이션)
            const grad = ctx.createLinearGradient(pole.x, 0, pole.x + pole.width, 0);
            grad.addColorStop(0, '#95a5a6');
            grad.addColorStop(0.5, '#dfe6e9');
            grad.addColorStop(1, '#7f8c8d');
            
            ctx.fillStyle = grad;
            ctx.fillRect(pole.x, pole.y, pole.width, canvas.height - pole.y);

            // 상단 마개
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.roundRect(pole.x - 4, pole.y, pole.width + 8, 12, 4);
            ctx.fill();
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경 디테일 (물 느낌)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.beginPath();
        ctx.arc(100, 100, 80, 0, Math.PI * 2);
        ctx.arc(280, 350, 50, 0, Math.PI * 2);
        ctx.fill();

        for (let i = bubbles.length - 1; i >= 0; i--) {
            bubbles[i].update();
            bubbles[i].draw();
            if (bubbles[i].y < -20) bubbles.splice(i, 1);
        }

        drawPoles();

        // 링 그리기 (스택 순서 고려: 아래 있는 것부터 그림)
        const sortedRings = [...rings].sort((a, b) => b.y - a.y);
        sortedRings.forEach(ring => {
            ring.update();
            ring.draw();
        });

        requestAnimationFrame(animate);
    }

    const handlePush = (side) => {
        // 기포 발생
        for(let i=0; i<12; i++) {
            setTimeout(() => bubbles.push(new Bubble(side)), i * 60);
        }
        rings.forEach(ring => ring.applyPush(side));
    };

    btnLeft.addEventListener('mousedown', (e) => { e.preventDefault(); handlePush('left'); });
    btnRight.addEventListener('mousedown', (e) => { e.preventDefault(); handlePush('right'); });
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handlePush('left'); });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handlePush('right'); });

    window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null) tiltX = e.gamma / 35;
    });

    animate();
</script>
</body>
</html>
