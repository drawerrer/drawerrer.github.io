<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>판타지 수중 링 던지기</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 500px;
            background: linear-gradient(180deg, #1cb5e0 0%, #000851 100%);
            border: 10px solid #27ae60;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .push-btn {
            width: 70px;
            height: 70px;
            border: 3px solid rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            color: white;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .push-btn:active {
            transform: scale(0.9) translateY(5px);
            background: rgba(255, 230, 0, 0.4);
        }

        .instruction {
            margin-top: 20px;
            color: #bdc3c7;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button class="push-btn" id="btn-left">L</button>
            <button class="push-btn" id="btn-right">R</button>
        </div>
    </div>
    <p class="instruction">버튼을 눌러 기포를 발생시키세요!<br>(기울기 센서 지원)</p>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    canvas.width = 360;
    canvas.height = 500;

    // 물리 상수
    const gravity = 0.06;
    const friction = 0.985;
    let tiltX = 0;

    // 막대 설정 (오브제 스타일)
    const poles = [
        { x: 110, y: 180, width: 12, height: 220 },
        { x: 250, y: 180, width: 12, height: 220 }
    ];

    // 기포 클래스
    class Bubble {
        constructor(side) {
            this.x = (side === 'left' ? 40 + Math.random() * 100 : 220 + Math.random() * 100);
            this.y = canvas.height + 10;
            this.radius = Math.random() * 4 + 2;
            this.speedY = Math.random() * 3 + 4;
            this.wobble = Math.random() * Math.PI * 2;
            this.alpha = 0.8;
        }
        update() {
            this.y -= this.speedY;
            this.wobble += 0.1;
            this.x += Math.sin(this.wobble) * 1.5; // 보글보글 흔들림
            this.alpha -= 0.005;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    // 링 클래스
    class Ring {
        constructor(index) {
            this.reset(index);
            this.color = ['#FFD700', '#FF7F50', '#E0FFFF', '#FF69B4', '#00FFFF'][index % 5];
        }

        reset(index) {
            this.x = 60 + (index * 25);
            this.y = canvas.height - 50;
            this.vx = 0;
            this.vy = 0;
            this.angleZ = Math.random() * Math.PI * 2; // 회전각
            this.angleX = 0; // 텀블링(뒤집힘) 각
            this.vAngleZ = 0;
            this.vAngleX = 0;
            this.isHooked = false;
            this.targetPole = null;
        }

        update() {
            // 기본 물리
            this.vy += gravity;
            this.vx += tiltX * 0.05; // 기울기 영향
            this.vx *= friction;
            this.vy *= friction;
            this.x += this.vx;
            this.y += this.vy;

            // 회전 물리
            this.angleZ += this.vAngleZ;
            this.angleX += this.vAngleX;
            this.vAngleZ *= 0.96;
            this.vAngleX *= 0.96;

            if (this.isHooked) {
                const poleCenter = this.targetPole.x + this.targetPole.width / 2;
                this.x += (poleCenter - this.x) * 0.2;
                this.angleX *= 0.8; // 걸리면 평평해짐
                
                // 스택 로직 (차곡차곡 쌓이기)
                let floorLimit = canvas.height - 25;
                rings.forEach(other => {
                    if (other !== this && other.isHooked && other.targetPole === this.targetPole) {
                        if (other.y > this.y) {
                            floorLimit = Math.min(floorLimit, other.y - 12);
                        }
                    }
                });

                if (this.y > floorLimit) {
                    this.y = floorLimit;
                    this.vy = 0;
                }

                // 탈출 조건
                if (this.y < this.targetPole.y - 20) {
                    this.isHooked = false;
                    this.targetPole = null;
                }
            } else {
                // 벽 충돌
                if (this.x < 25) { this.x = 25; this.vx *= -0.5; }
                if (this.x > canvas.width - 25) { this.x = canvas.width - 25; this.vx *= -0.5; }
                if (this.y > canvas.height - 25) { this.y = canvas.height - 25; this.vy *= -0.5; }
                if (this.y < 25) { this.y = 25; this.vy *= -0.5; }

                // 막대 걸림 판정
                poles.forEach(pole => {
                    if (Math.abs(this.x - (pole.x + pole.width/2)) < 20) {
                        if (this.y > pole.y && this.y < pole.y + 40 && this.vy > 0) {
                            this.isHooked = true;
                            this.targetPole = pole;
                        }
                    }
                });
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angleZ);
            
            const rx = 22;
            const ry = 7 + (15 * Math.abs(Math.sin(this.angleX))); // 3D 텀블링 효과

            // 링 디자인 (스트라이프)
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, i * (Math.PI/4), (i+1) * (Math.PI/4));
                ctx.strokeStyle = i % 2 === 0 ? this.color : '#FFFFFF';
                ctx.lineWidth = 8;
                ctx.stroke();
            }
            ctx.restore();
        }

        applyPush(side) {
            const dist = Math.abs(this.x - (side === 'left' ? 90 : 270));
            const power = Math.max(0, 1 - dist / 300);
            
            this.vy -= (Math.random() * 5 + 5) * power;
            this.vx += (side === 'left' ? 1 : -1) * (Math.random() * 4) * power;
            this.vAngleZ = (Math.random() - 0.5) * 0.5;
            this.vAngleX = Math.random() * 0.4;
        }
    }

    const rings = Array.from({ length: 10 }, (_, i) => new Ring(i));
    const bubbles = [];

    function drawPoles() {
        poles.forEach(pole => {
            // 기둥 그림자
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(pole.x + 5, pole.y, pole.width, canvas.height - pole.y);

            // 기둥 본체 (금속 느낌 그라데이션)
            const grad = ctx.createLinearGradient(pole.x, 0, pole.x + pole.width, 0);
            grad.addColorStop(0, '#7f8c8d');
            grad.addColorStop(0.5, '#ecf0f1');
            grad.addColorStop(1, '#95a5a6');
            
            ctx.fillStyle = grad;
            ctx.fillRect(pole.x, pole.y, pole.width, canvas.height - pole.y);

            // 기둥 머리 (장식)
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(pole.x - 4, pole.y, pole.width + 8, 15);
        });
    }

    function spawnBubbles(side) {
        for(let i=0; i<15; i++) {
            setTimeout(() => bubbles.push(new Bubble(side)), i * 50);
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 기포 업데이트
        for (let i = bubbles.length - 1; i >= 0; i--) {
            bubbles[i].update();
            bubbles[i].draw();
            if (bubbles[i].y < -20 || bubbles[i].alpha <= 0) bubbles.splice(i, 1);
        }

        drawPoles();

        rings.forEach(ring => {
            ring.update();
            ring.draw();
        });

        requestAnimationFrame(animate);
    }

    // 이벤트 리스너
    const handlePush = (side) => {
        spawnBubbles(side);
        rings.forEach(ring => ring.applyPush(side));
        
        // iOS 권한 요청 처리
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission();
        }
    };

    btnLeft.addEventListener('mousedown', () => handlePush('left'));
    btnRight.addEventListener('mousedown', () => handlePush('right'));
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handlePush('left'); });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handlePush('right'); });

    // 기울기 센서
    window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null) tiltX = e.gamma / 30;
    });

    animate();
</script>
</body>
</html>
