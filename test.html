<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바닷속 인어공주 링 던지기</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #001f3f; /* 깊은 바다색 */
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 520px;
            /* 바닷속 인어공주 배경 이미지 적용 */
            background-image: url('image_2.png'); 
            background-size: cover;
            background-position: center;
            border: 8px solid #c0a060; /* 조개 껍데기의 금테두리 느낌 */
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 45px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .push-btn {
            width: 75px;
            height: 75px;
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); /* 배경과 어우러지는 투명도 */
            backdrop-filter: blur(5px);
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            transition: all 0.1s;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .push-btn:active {
            transform: scale(0.9) translateY(5px);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button class="push-btn" id="btn-left">PUSH</button>
            <button class="push-btn" id="btn-right">PUSH</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    canvas.width = 360;
    canvas.height = 520;

    // 물리 상수
    const gravity = 0.045;
    const friction = 0.97;
    // 링이 쌓일 때의 수직 간격 (튜브 두께 + 약간의 여유)
    // 튜브 이미지처럼 통통하게 쌓이려면 간격이 넉넉해야 함
    const ringStackHeight = 24; 

    const poles = [
        { x: 100, y: 190, width: 14, height: 230 },
        { x: 260, y: 190, width: 14, height: 230 }
    ];

    // 튜브 이미지의 컬러 팔레트 (파랑, 주황, 핑크)
    const ringColors = [
        { main: '#00bcd4', light: '#80deea' }, // Cyan
        { main: '#ff9800', light: '#ffb74d' }, // Orange
        { main: '#e91e63', light: '#f48fb1' }  // Pink
    ];

    class Bubble {
        constructor(side) {
            this.x = (side === 'left' ? 30 + Math.random() * 120 : 210 + Math.random() * 120);
            this.y = canvas.height + 10;
            this.radius = Math.random() * 3 + 2;
            this.speedY = Math.random() * 2 + 3;
            this.wobble = Math.random() * 10;
            this.alpha = 0.5;
        }
        update() {
            this.y -= this.speedY;
            this.wobble += 0.1;
            this.x += Math.sin(this.wobble) * 1.5;
            this.alpha -= 0.008;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    class Ring {
        constructor(index) {
            this.colors = ringColors[index % ringColors.length];
            this.reset(index);
        }

        reset(index) {
            this.x = 80 + (index * 22);
            this.y = canvas.height - 40;
            this.vx = 0;
            this.vy = 0;
            this.angleZ = Math.random() * Math.PI;
            this.angleX = 0; 
            this.vAngleZ = 0;
            this.vAngleX = 0;
            this.isHooked = false;
            this.targetPole = null;
        }

        update() {
            this.vy += gravity;
            this.vx *= friction;
            this.vy *= friction;
            this.x += this.vx;
            this.y += this.vy;

            this.angleZ += this.vAngleZ;
            this.angleX += this.vAngleX;
            this.vAngleZ *= 0.95;
            this.vAngleX *= 0.95;

            // 정착 시 회전 멈춤 및 수평 유지 (완전히 눕도록)
            if (this.isHooked || this.y > canvas.height - 50) {
                this.angleX *= 0.7;
                this.vAngleX *= 0.6;
                if(Math.abs(this.angleX) < 0.05) this.angleX = 0;
            }

            if (this.isHooked) {
                const poleCenter = this.targetPole.x + this.targetPole.width / 2;
                this.x += (poleCenter - this.x) * 0.2;
                
                // *** 핵심 수정: 스택 로직 개선 ***
                // 튜브 두께를 고려하여 쌓이는 기준점을 높임
                let floorLimit = canvas.height - 35; 
                
                rings.forEach(other => {
                    // 나보다 아래에 정착한 링이 있으면 그 위에 쌓임
                    if (other !== this && other.isHooked && other.targetPole === this.targetPole) {
                        if (other.y > this.y) {
                            // ringStackHeight 만큼 간격을 두고 쌓임
                            floorLimit = Math.min(floorLimit, other.y - ringStackHeight);
                        }
                    }
                });

                if (this.y > floorLimit) {
                    this.y = floorLimit;
                    this.vy = 0; // 튀어오름 없이 착지
                    this.vx = 0;
                }

                if (this.y < this.targetPole.y - 20) {
                    this.isHooked = false;
                    this.targetPole = null;
                }
            } else {
                // 벽 충돌
                if (this.x < 25 || this.x > canvas.width - 25) this.vx *= -0.5;
                if (this.y < 25) this.vy *= -0.5;
                if (this.y > canvas.height - 30) {
                    this.y = canvas.height - 30;
                    this.vy *= -0.2;
                }
                this.x = Math.max(25, Math.min(canvas.width - 25, this.x));

                // 걸림 판정
                poles.forEach(pole => {
                    if (Math.abs(this.x - (pole.x + pole.width/2)) < 18) {
                        if (this.y > pole.y && this.y < pole.y + 40 && this.vy > 0) {
                            this.isHooked = true;
                            this.targetPole = pole;
                        }
                    }
                });
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angleZ);
            
            // *** 핵심 수정: 링 디자인 변경 (튜브 스타일) ***
            const rx = 26; // 가로 반지름 (조금 더 넓게)
            // 텀블링 시 두께 변화 (기본 두께 10 + 회전 효과)
            // 누웠을 때 가장 두꺼워 보이도록 조정
            const ry = 10 + (10 * Math.abs(Math.sin(this.angleX))); 
            const ringThickness = 16; // 튜브 자체의 두께 (통통하게)

            // 입체감을 위한 그라데이션
            const grad = ctx.createLinearGradient(-rx, -ry, rx, ry);
            grad.addColorStop(0, this.colors.main);
            grad.addColorStop(1, this.colors.light);

            // 메인 몸체 그리기 (두꺼운 타원 스트로크)
            ctx.beginPath();
            // ry를 조금 줄여서 중앙의 구멍을 표현
            ctx.ellipse(0, 0, rx, ry * 0.8, 0, 0, Math.PI * 2);
            ctx.strokeStyle = grad;
            ctx.lineWidth = ringThickness;
            ctx.stroke();

            // 하이라이트 (진주 같은 반짝임 효과)
            ctx.beginPath();
            ctx.ellipse(0, -ry*0.6, rx*0.8, ry*0.2, 0, Math.PI, Math.PI*2);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }

        applyPush(side) {
            const power = Math.random() * 3 + 4; // 압력 약간 조절
            this.vy -= power;
            this.vx += (side === 'left' ? 1 : -1) * (Math.random() * 2.5);
            this.vAngleZ = (Math.random() - 0.5) * 0.4;
            this.vAngleX = Math.random() * 0.3;
        }
    }

    // 링 개수 6개로 조정 (튜브가 커져서 개수 조정)
    const rings = Array.from({ length: 6 }, (_, i) => new Ring(i));
    const bubbles = [];

    function drawPoles() {
        poles.forEach(pole => {
            // 그림자
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; // 배경에 맞춰 그림자 진하게
            ctx.fillRect(pole.x + 4, pole.y + 5, pole.width, canvas.height - pole.y);

            // 기둥 (바닷속 유물 느낌 그라데이션)
            const grad = ctx.createLinearGradient(pole.x, 0, pole.x + pole.width, 0);
            grad.addColorStop(0, '#8d6e63'); // Bronze/Wood dark
            grad.addColorStop(0.5, '#d7ccc8'); // Bronze/Wood light
            grad.addColorStop(1, '#8d6e63');
            ctx.fillStyle = grad;
            ctx.fillRect(pole.x, pole.y, pole.width, canvas.height - pole.y);
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = bubbles.length - 1; i >= 0; i--) {
            bubbles[i].update();
            bubbles[i].draw();
            if (bubbles[i].y < -20) bubbles.splice(i, 1);
        }

        drawPoles();

        // Y축 기준 정렬 (뒤에 있는 링 먼저 그리기)
        rings.sort((a, b) => a.y - b.y);
        rings.forEach(ring => {
            ring.update();
            ring.draw();
        });

        requestAnimationFrame(animate);
    }

    const handlePush = (side) => {
        for(let i=0; i<10; i++) setTimeout(() => bubbles.push(new Bubble(side)), i * 40);
        rings.forEach(ring => ring.applyPush(side));
    };

    btnLeft.addEventListener('mousedown', (e) => { e.preventDefault(); handlePush('left'); });
    btnRight.addEventListener('mousedown', (e) => { e.preventDefault(); handlePush('right'); });
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handlePush('left'); });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handlePush('right'); });

    animate();
</script>
</body>
</html>
