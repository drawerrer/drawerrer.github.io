    <script>
        // Check for saved theme preference or use system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>

        tailwind.config = {

    <style type="text/tailwindcss">

        body {

        }

        }

        .tray-trigger:hover .tray-content {
            transform: translateX(-32px) translateY(-4px);

            box-shadow: 10px 10px 20px rgba(0,0,0,0.15);

        .bedroom-wall {
            background-image: url('assets/Wall.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
        }

        .dark .bedroom-wall {

            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('assets/Wall.png');

        .lamp-glow-effect {
            background: radial-gradient(circle at center, var(--lamp-inner) 0%, var(--lamp-glow) 50%, transparent 90%);
        }

        .floor-texture {
            background-image: url('assets/Floor.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            transition: filter 0.5s ease;
        }

        .dark .floor-texture {
            filter: brightness(0.3);
        }

        .cabinet-lighting {
            background: linear-gradient(105deg, rgba(255,230,180,0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        .dark .cabinet-lighting {
            background: linear-gradient(105deg, rgba(255,160,50,0.18) 0%, rgba(255,160,50,0.05) 30%, transparent 60%);
        }

        .wood-grain-texture {
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
                              linear-gradient(90deg, rgba(0,0,0,0.03) 0%, transparent 50%, rgba(0,0,0,0.03) 100%);
        }

        .striped-bedding {
            background: repeating-linear-gradient(90deg, #f8f8f8, #f8f8f8 6px, #dee2e6 6px, #dee2e6 12px);
        }

        .dark .striped-bedding {
            background: repeating-linear-gradient(90deg, #1e2124, #1e2124 6px, #141619 6px, #141619 12px);
        }

        .book-stack div:nth-child(odd) { background-color: #fefce8; border-left: 4px solid #991b1b; }
        .book-stack div:nth-child(even) { background-color: #f3f4f6; border-left: 4px solid #1e3a8a; }

        .dark .book-stack div:nth-child(odd) { background-color: #1c1917; border-left: 4px solid #7c2d12; }
        .dark .book-stack div:nth-child(even) { background-color: #1a1a1a; border-left: 4px solid #1e3a8a; }

        .lamp-cast-light {
            background: radial-gradient(ellipse at bottom left, rgba(255, 140, 0, 0.25) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .dark .lamp-cast-light {
            opacity: 1;
        }
    </style>

<!-- Default to Light or Dark based on user pref, but here we start light as common web default or dark if requested. Let's start light and toggle. -->
