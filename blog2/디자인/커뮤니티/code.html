<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Community Drawer | Collective Archive</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Space+Grotesk:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#8B735B",
                        "wood-light": "#E5D3B3",
                        "wood-dark": "#7C6246",
                        "paper-aged": "#F4F1EA",
                    },
                    fontFamily: {
                        display: ["Space Grotesk", "sans-serif"],
                        serif: ["Playfair Display", "serif"],
                        sans: ["Inter", "sans-serif"],
                    }
                },
            },
        };
    </script>
<style type="text/tailwindcss">.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
    }
.perspective-2000 {
    perspective: 2000px
    }
.drawer-tilt {
    transform: rotatex(20deg);
    transform-style: preserve-3d
    }
.compartment {
    box-shadow: inset 2px 2px 10px rgba(0, 0, 0, 0.3), inset -1px -1px 2px rgba(255, 255, 255, 0.15);
    background-color: rgba(0, 0, 0, 0.1)
    }
.wood-texture {
    background-color: #dcc6a1;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuC_MrSaZotVYPBLV-UiMfa5DVVMHBI8t0h7Co6_yTAg9GPGuKcl8rkcVsId4URWgRiKpYdpjMtZR5AT-SiHyBNBNfO8IW-2qkFH-YRoe-nwIRQNxc55YTWuZV0jEVsgVG9gXpE8MWegYbtUw2HkQFPjqQiMpD_qRzrUCra30QijZZUKpDZyoB0UGy-o4OWsKRrPUbGRcn9K58MDo_Vmz9GI_9ItoS2CVve_Ch3a-HIYX4Q1wWQnspkabGRbXtidingScd71cEE8KwNM);
    background-blend-mode: multiply
    }
.drawer-shadow {
    box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.4), 0 30px 60px -30px rgba(0, 0, 0, 0.5)
    }
.scrim-gradient {
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.2) 100%)
    }
.paper-stack {
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1), 0 2px 0 #fff, 0 3px 0 rgba(0, 0, 0, 0.1), 0 4px 0 #fff, 0 5px 0 rgba(0, 0, 0, 0.1), 0 10px 20px rgba(0, 0, 0, 0.15)
    }
.pencil {
    filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.3))
    }
.paperclip {
    border: 1.5px solid #a1a1aa;
    border-radius: 10px;
    width: 8px;
    height: 20px;
    position: relative
    }
.paperclip::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    right: 2px;
    bottom: 6px;
    border: 1px solid #a1a1aa;
    border-radius: 6px;
    border-top: none
    }</style>
</head>
<body class="bg-gray-200 dark:bg-zinc-950 font-sans h-screen overflow-hidden">
<div class="fixed inset-0 z-0 bg-white/40 dark:bg-black/60 backdrop-blur-md"></div>
<main class="relative z-10 h-full w-full flex items-center justify-center p-8 perspective-2000">
<a class="fixed top-8 left-8 z-50 flex items-center gap-2 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined">arrow_back</span>
<span class="text-xs uppercase tracking-widest font-display">Back to Cabinet</span>
</a>
<div class="drawer-tilt relative w-full max-w-5xl bg-[#DCC6A1] p-6 rounded-sm drawer-shadow border-t-4 border-white/40 border-l-2 border-white/20">
<div class="absolute -top-4 left-0 w-full h-4 bg-[#C8B28E] rounded-t-sm"></div>
<div class="wood-texture p-6 border-2 border-black/20 shadow-inner relative min-h-[500px]">
<div class="absolute inset-0 pointer-events-none scrim-gradient opacity-40"></div>
<div class="grid grid-cols-12 grid-rows-6 gap-6 h-full">
<div class="compartment col-span-2 row-span-6 relative flex items-center justify-center overflow-hidden">
<div class="w-4 h-48 bg-emerald-700/80 rounded-sm rotate-2 pencil absolute top-10 left-4"></div>
<div class="w-1 h-32 bg-zinc-800 absolute bottom-8 right-6 rotate-[-5deg]"></div>
</div>
<div class="compartment col-span-5 row-span-2 relative p-4 flex gap-2 items-end justify-center overflow-hidden">
<div class="w-3 h-32 bg-yellow-500 rounded-sm pencil -rotate-12 translate-x-2"></div>
<div class="w-3 h-36 bg-red-600 rounded-sm pencil rotate-3"></div>
<div class="w-3 h-34 bg-blue-500 rounded-sm pencil -rotate-6"></div>
<div class="w-3 h-28 bg-emerald-500 rounded-sm pencil rotate-12 -translate-x-2"></div>
<div class="w-3 h-40 bg-zinc-800 rounded-sm pencil rotate-1"></div>
<div class="w-3 h-32 bg-orange-400 rounded-sm pencil -rotate-3"></div>
</div>
<div class="compartment col-span-2 row-span-2 relative p-4 flex flex-wrap gap-2 content-center justify-center">
<div class="paperclip rotate-45"></div>
<div class="paperclip -rotate-12"></div>
<div class="paperclip rotate-[110deg]"></div>
<div class="paperclip -rotate-45"></div>
<div class="w-2 h-2 rounded-full bg-red-500 shadow-sm"></div>
<div class="w-2 h-2 rounded-full bg-blue-500 shadow-sm"></div>
</div>
<div class="compartment col-span-3 row-span-2 relative flex items-center justify-center">
<div class="w-16 h-12 bg-[#F4F1EA] rounded-sm shadow-sm rotate-2 opacity-80 border border-black/5 flex items-center justify-center">
<span class="text-[8px] uppercase tracking-tighter text-gray-400 font-mono">Archive-X</span>
</div>
</div>
<div class="col-span-8 row-span-4 relative flex items-center justify-center pt-4">
<div class="compartment absolute inset-0 -m-1 pointer-events-none opacity-40"></div>
<div class="paper-stack w-[85%] h-[90%] bg-white p-8 relative group cursor-pointer hover:scale-[1.01] transition-transform">
<div class="absolute top-4 right-6 text-gray-300 font-display text-[10px] uppercase tracking-widest">Memo 03-A</div>
<div class="space-y-4 pt-4">
<div class="h-[1px] bg-gray-100 w-full"></div>
<div class="h-[1px] bg-gray-100 w-full"></div>
<div class="h-[1px] bg-gray-100 w-full"></div>
<div class="h-[1px] bg-gray-100 w-full"></div>
</div>
<div class="mt-8 flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-gray-300 text-4xl mb-2">edit_note</span>
<p class="font-serif italic text-xl text-gray-400">Leave a thought in the collective...</p>
</div>
<div class="absolute bottom-6 left-8 flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-gray-50 border border-gray-100"></div>
<div class="h-2 w-24 bg-gray-50 rounded-full"></div>
</div>
</div>
</div>
<div class="compartment col-span-2 row-span-4 relative overflow-hidden">
<div class="absolute inset-0 bg-wood-dark/10"></div>
<div class="w-4/5 h-1/2 bg-indigo-900/10 border border-indigo-900/10 m-auto mt-4 backdrop-blur-[1px]"></div>
</div>
</div>
</div>
<div class="mt-4 h-16 bg-[#DCC6A1] border-t-2 border-black/15 flex flex-col items-center justify-center relative">
<div class="flex items-center gap-4 bg-white/95 px-5 py-2 border border-black/20 shadow-sm mb-1">
<span class="text-[10px] font-bold text-gray-400">03</span>
<span class="font-display text-sm tracking-[0.4em] font-medium text-gray-800">COMMUNITY</span>
</div>
<div class="w-32 h-2 border-x-2 border-b-2 border-black/20 rounded-b-xl mt-1"></div>
</div>
</div>
<div class="fixed bottom-12 left-12 opacity-50">
<h2 class="font-display text-2xl font-bold tracking-tighter text-gray-900 dark:text-white uppercase">Drawer Archive</h2>
<p class="text-[10px] uppercase tracking-[0.4em] mt-1 text-gray-600 dark:text-gray-400">Specimen No. 22-C / Social</p>
</div>
<div class="fixed bottom-12 right-12 text-gray-500 font-display text-[10px] uppercase tracking-widest pointer-events-none">
        Select memo papers to contribute to the archive
    </div>
</main>
<nav class="fixed top-8 right-8 z-50">
<button class="p-2 rounded-full bg-white/80 dark:bg-black/30 backdrop-blur-md border border-gray-200 dark:border-gray-800 text-gray-800 dark:text-gray-200 hover:scale-110 transition-all shadow-sm" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined block dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>
</nav>

</body></html>
